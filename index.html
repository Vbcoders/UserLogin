<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Private Chat • Sign in</title><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#eef2f7;color:#172033}body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(420px,100%);background:rgba(255,255,255,.96);border:1px solid #e7ebf2;border-radius:26px;padding:34px;box-shadow:0 24px 70px rgba(18,32,59,.16)}.brand{width:54px;height:54px;border-radius:17px;background:#2563eb;color:white;display:grid;place-items:center;font-weight:800;font-size:22px;margin-bottom:22px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#2563eb}.title{font-size:29px;margin:7px 0 8px}.sub{font-size:14px;line-height:1.55;color:#7b8495;margin:0 0 25px}.field{margin-bottom:15px}.label{display:block;font-size:12px;font-weight:700;margin-bottom:7px;color:#4d586c}.inputbox{position:relative}.input{width:100%;height:50px;border:1px solid #dce2eb;border-radius:13px;padding:0 14px;outline:none;background:#fbfcfe;font-size:15px}.input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}.toggle{position:absolute;right:8px;top:7px;height:36px;border:0;background:transparent;color:#647087;font-size:12px}.login{width:100%;height:50px;border:0;border-radius:13px;background:#2563eb;color:white;font-weight:700;margin-top:4px}.login:disabled{opacity:.6;cursor:wait}.error{min-height:22px;color:#dc2626;font-size:12px;margin-top:13px;line-height:1.4}.note{font-size:11px;color:#8a93a4;text-align:center;margin:22px 0 0}.footer{text-align:center;font-size:11px;color:#9aa2b1;margin-top:18px}@media(max-width:480px){body{padding:14px}.card{padding:27px 22px;border-radius:22px}}
</style></head><body><main class="card"><div class="brand">P</div><div class="eyebrow">Private access</div><h1 class="title">Welcome back</h1><p class="sub">This conversation is restricted. Sign in with the username and password provided to you.</p><form id="loginForm"><div class="field"><label class="label" for="username">Username</label><input class="input" id="username" autocomplete="username" autocapitalize="none" maxlength="40" placeholder="Enter username" required></div><div class="field"><label class="label" for="password">Password</label><div class="inputbox"><input class="input" id="password" type="password" autocomplete="current-password" maxlength="128" placeholder="Enter password" required><button class="toggle" id="toggle" type="button">Show</button></div></div><button class="login" id="loginBtn" type="submit">Sign in securely</button><div class="error" id="error"></div></form><p class="note">Do not share your login details. The chat page is not a substitute for Firebase security rules.</p><div class="footer">VBCoders • Private Chat</div></main><script>const firebaseConfig={apiKey:"AIzaSyBEw7edw-jRq47N_d1fJUvBSVnROJ6eCcE",authDomain:"messanger-817c9.firebaseapp.com",databaseURL:"https://messanger-817c9-default-rtdb.firebaseio.com",projectId:"messanger-817c9",storageBucket:"messanger-817c9.appspot.com",messagingSenderId:"678307855723",appId:"1:678307855723:web:ac21ee338a71dd34f9602e"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth();const form=document.getElementById('loginForm'),username=document.getElementById('username'),password=document.getElementById('password'),btn=document.getElementById('loginBtn'),error=document.getElementById('error'),toggle=document.getElementById('toggle');toggle.onclick=()=>{const show=password.type==='password';password.type=show?'text':'password';toggle.textContent=show?'Hide':'Show'};function emailForUser(u){return u.trim().toLowerCase().replace(/[^a-z0-9._-]/g,'')+'@vbcoders-privatechat.local'}auth.onAuthStateChanged(user=>{if(user){localStorage.setItem('name',user.displayName||username.value.trim()||localStorage.getItem('name')||'User');if(user.photoURL)localStorage.setItem('profilePicUrl',user.photoURL);window.location.replace('chat.html')}});form.onsubmit=e=>{e.preventDefault();error.textContent='';const u=username.value.trim();const p=password.value;if(!u||!p)return;btn.disabled=true;btn.textContent='Signing in…';auth.signInWithEmailAndPassword(emailForUser(u),p).then(result=>{localStorage.setItem('name',result.user.displayName||u);if(result.user.photoURL)localStorage.setItem('profilePicUrl',result.user.photoURL);window.location.replace('chat.html')}).catch(e=>{console.error(e);if(e.code==='auth/user-not-found'||e.code==='auth/wrong-password'||e.code==='auth/invalid-credential')error.textContent='Invalid username or password.';else if(e.code==='auth/too-many-requests')error.textContent='Too many attempts. Please wait and try again.';else if(e.code==='auth/operation-not-allowed')error.textContent='Email/Password sign-in is not enabled in Firebase Authentication.';else error.textContent='Unable to sign in. Please try again.';btn.disabled=false;btn.textContent='Sign in securely'})};</script></body></html>
