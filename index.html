';toggle.textContent=show?'Hide':'Show'};let redirecting=false;auth.onAuthStateChanged(user=>{if(user&&!redirecting){redirecting=true;localStorage.setItem('name',user.displayName||username.value.trim()||user.email||'User');if(user.photoURL)localStorage.setItem('profilePicUrl',user.photoURL);window.location.replace('chat.html')}});form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';const email=username.value.trim().toLowerCase(),pass=password.value;if(!email||!pass)return;btn.disabled=true;btn.textContent='Signing in…';try{const result=await auth.signInWithEmailAndPassword(email,pass);localStorage.setItem('name',result.user.displayName||email);if(result.user.photoURL)localStorage.setItem('profilePicUrl',result.user.photoURL);redirecting=true;window.location.replace('chat.html')}catch(e){console.error('Firebase login error:',e);const code=e&&e.code||'';const msg=e&&e.message||'';if(code==='auth/invalid-api-key')error.textContent='Firebase configuration error: invalid API key.';else if(code==='auth/app-not-authorized')error.textContent='Firebase blocked this website domain. Check Authorized domains/API key restrictions.';else if(code==='auth/unauthorized-domain')error.textContent='This website domain is not authorized in Firebase.';else if(code==='auth/operation-not-allowed')error.textContent='Email/Password sign-in is disabled in Firebase.';else if(code==='auth/invalid-email')error.textContent='Enter a valid email address.';else if(code==='auth/user-not-found'||code==='auth/wrong-password'||code==='auth/invalid-credential')error.textContent='Invalid username or password.';else if(code==='auth/too-many-requests')error.textContent='Too many attempts. Please wait and try again.';else error.textContent='Firebase error: '+code+(msg?' — '+msg:'');btn.disabled=false;btn.textContent='Sign in securely'}});</script></body></html>
