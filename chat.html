<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Private Chat</title><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#eef3fa;color:#172033}.app{height:100%;display:flex;justify-content:center}.chat{width:min(900px,100%);height:100%;display:flex;flex-direction:column;background:#fff}.head{height:76px;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid #e5e9f0;background:#fff}.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#edf1f7;border:3px solid #e9edff}.person{flex:1;min-width:0}.name{font-weight:700;font-size:16px}.status{font-size:12px;color:#78849a;margin-top:4px}.green,.gray{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.green{background:#20b86a}.gray{background:#aab3c2}.menuBox{position:relative}.dots{font-size:25px;border:0;background:#f4f6fa;border-radius:12px;width:42px;height:42px}.menu{position:absolute;right:0;top:48px;width:180px;background:#fff;border:1px solid #e1e6ee;border-radius:14px;box-shadow:0 12px 35px #65708b25;padding:6px;z-index:10}.hidden{display:none!important}.menu button{width:100%;padding:12px;border:0;background:none;text-align:left;border-radius:9px}.messages{flex:1;overflow:auto;padding:20px;background:linear-gradient(#f9fbfe,#f3f6fb)}.row{display:flex;margin:7px 0}.mine{justify-content:flex-end}.bubble{max-width:75%;padding:11px 13px;border-radius:18px;background:#fff;border:1px solid #e1e6ef;box-shadow:0 3px 12px #65708b12;overflow-wrap:anywhere}.mine .bubble{background:#5b74ef;color:#fff;border:0;border-bottom-right-radius:5px}.theirs .bubble{border-bottom-left-radius:5px}.meta{font-size:10px;text-align:right;margin-top:4px;opacity:.7}.msgimg{max-width:300px;max-height:400px;border-radius:13px;display:block;cursor:pointer}.delete{font-size:10px;color:#e04f63;border:0;background:none;display:block;margin-left:auto;margin-top:4px}.typing{height:20px;padding-left:20px;font-size:12px;color:#5570d8}.composer{display:flex;gap:8px;padding:10px;border-top:1px solid #e5e9f0;background:#fff}.input{flex:1;border:1px solid #dfe5ee;background:#f5f7fa;border-radius:16px;padding:12px;resize:none;outline:0;font-size:15px}.send,.attach{width:44px;border:0;border-radius:14px}.attach{background:#edf1f7}.send{background:#5b74ef;color:#fff}.send.off{opacity:.45}.viewer{position:fixed;inset:0;background:#172033dd;display:none;align-items:center;justify-content:center;z-index:20}.viewer.show{display:flex}.viewer img{max-width:94%;max-height:90%}.close{position:absolute;right:20px;top:15px;font-size:30px;color:white;background:none;border:0}@media(max-width:600px){.chat{width:100%}.messages{padding:12px}.bubble{max-width:84%}.msgimg{max-width:75vw}}</style></head><body><div class="app"><div class="chat"><div class="head"><img id="avatar" class="avatar"><div class="person"><div id="name" class="name">Private Chat</div><div id="status" class="status">Connecting…</div></div><div class="menuBox"><button id="dots" class="dots">⋯</button><div id="menu" class="menu hidden"><button id="account">My account</button><button id="logout">Logout</button></div></div></div><div id="messages" class="messages"></div><div id="typing" class="typing hidden">typing…</div><div class="composer"><input id="file" type="file" accept="image/*" hidden><button id="attach" class="attach">＋</button><textarea id="input" class="input" rows="1" placeholder="Write a private message…"></textarea><button id="send" class="send off">➤</button></div></div></div><div id="viewer" class="viewer"><button id="close" class="close">×</button><img id="viewerImg"></div><script>const config={apiKey:'AIzaSyBEw7edw-jRq47N_d1fJUvBSVnROJ6eCcE',authDomain:'messanger-817c9.firebaseapp.com',databaseURL:'https://messanger-817c9-default-rtdb.firebaseio.com',projectId:'messanger-817c9',storageBucket:'messanger-817c9.appspot.com',messagingSenderId:'678307855723',appId:'1:678307855723:web:ac21ee338a71dd34f9602e'};firebase.initializeApp(config);const auth=firebase.auth(),db=firebase.database();let me,partner=null,timer;const $=id=>document.getElementById(id);auth.onAuthStateChanged(u=>{if(!u){location.replace('index.html');return}me=u;start()});function start(){const p=db.ref('presence/online/'+me.uid);p.set(true);p.onDisconnect().remove();$('avatar').src=me.photoURL||'';db.ref('chats').on('value',snap=>{let a=[];snap.forEach(c=>{const v=c.val();if(v&&v.uid)a.push({...v,key:c.key})});a.sort((x,y)=>(x.timestampMs||0)-(y.timestampMs||0));const inc=a.filter(x=>x.uid!==me.uid);if(inc.length){const x=inc[inc.length-1];partner=x.uid;$('name').textContent=x.senderName||x.name||x.email||'User';$('avatar').src=x.profilePicUrl||me.photoURL||'';presence()}render(a)});db.ref('presence/typing').on('value',snap=>{const x=partner&&snap.val()&&snap.val()[partner];const yes=x&&x.active&&Date.now()-(x.ts||Date.now())<3500;$('typing').classList.toggle('hidden',!yes);if(yes)$('status').innerHTML='<span class="green"></span>typing…';else presence()});$('dots').onclick=e=>{e.stopPropagation();$('menu').classList.toggle('hidden')};document.onclick=()=>{$('menu').classList.add('hidden')};$('account').onclick=e=>{e.stopPropagation();alert('Signed in as: '+(me.email||'User'));$('menu').classList.add('hidden')};$('logout').onclick=()=>auth.signOut();$('input').oninput=()=>{const v=$('input').value.trim();$('send').classList.toggle('off',!v);typing(v)};$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('send').onclick=send;$('attach').onclick=()=>$('file').click();$('file').onchange=()=>{if($('file').files[0])sendImage($('file').files[0])};$('close').onclick=()=>{$('viewer').classList.remove('show')}}function presence(){if(!partner)return;db.ref('presence/online/'+partner).once('value').then(s=>{$('status').innerHTML=s.val()?'<span class="green"></span>Active now':'<span class="gray"></span>Offline'})}function typing(v){clearTimeout(timer);const r=db.ref('presence/typing/'+me.uid);r.set({active:!!v,ts:firebase.database.ServerValue.TIMESTAMP});r.onDisconnect().remove();if(v)timer=setTimeout(()=>typing(false),1800)}function send(){const text=$('input').value.trim();if(!text)return;db.ref('chats').push({uid:me.uid,senderName:me.displayName||me.email||'User',message:text,timestampMs:Date.now()});$('input').value='';$('send').classList.add('off');typing(false)}function sendImage(f){const r=new FileReader();r.onload=()=>db.ref('chats').push({uid:me.uid,senderName:me.displayName||me.email||'User',image:r.result,timestampMs:Date.now()});r.readAsDataURL(f)}function render(a){const box=$('messages');box.innerHTML=a.length?'':'<div style="text-align:center;padding-top:35vh;color:#8a95a8">Start your private conversation</div>';a.forEach(x=>{const row=document.createElement('div');row.className='row '+(x.uid===me.uid?'mine':'theirs');const b=document.createElement('div');b.className='bubble';if(x.image){const im=document.createElement('img');im.src=x.image;im.className='msgimg';im.onclick=()=>{$('viewerImg').src=x.image;$('viewer').classList.add('show')};b.appendChild(im)}if(x.message){const t=document.createElement('div');t.textContent=x.message;b.appendChild(t)}const meta=document.createElement('div');meta.className='meta';meta.textContent=new Date(x.timestampMs||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});b.appendChild(meta);if(x.uid===me.uid){const d=document.createElement('button');d.className='delete';d.textContent='Delete';d.onclick=()=>db.ref('chats/'+x.key).remove();b.appendChild(d)}row.appendChild(b);box.appendChild(row)});box.scrollTop=box.scrollHeight}</script></body></html>
