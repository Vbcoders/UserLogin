<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Private Chat</title><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script><style>:root{--blue:#2563eb;--blue2:#4f8df7;--ink:#172033;--muted:#7b8495;--line:#e6ebf2;--green:#22c55e}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#f2f7ff;user-select:none}body{overflow:hidden;visibility:hidden}body.ready{visibility:visible}button,input,textarea{font:inherit}button{cursor:pointer}.app{height:100dvh;display:flex;justify-content:center;align-items:center;padding:14px;background:radial-gradient(circle at 0 0,#dbeafe,transparent 32%),radial-gradient(circle at 100% 100%,#dcfce7,transparent 28%),#f4f8ff}.chat{width:min(1000px,100%);height:min(920px,100%);background:#fff;border-radius:25px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 70px #163a5d20}.header{height:76px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:#fff;flex:none}.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#edf2fa}.person{flex:1;min-width:0}.name{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:12px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px}.dot{width:7px;height:7px;border-radius:50%;background:#aeb7c5}.dot.online{background:var(--green);box-shadow:0 0 0 3px #22c55e19}.menu-wrap{position:relative}.more{width:40px;height:40px;border:0;background:transparent;border-radius:12px;font-size:23px;color:#586579}.menu{position:absolute;right:0;top:47px;width:215px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:7px;box-shadow:0 18px 45px #15243b25;z-index:30}.menu.hidden{display:none}.menu button{width:100%;border:0;background:#fff;text-align:left;padding:11px;border-radius:10px;color:#26364d}.menu button:hover{background:#f4f7fb}.logout{color:#dc2626!important}.messages{flex:1;min-height:0;overflow:auto;padding:20px 17px 12px;background:#f8fbff;background-image:radial-gradient(#dce8f5 1px,transparent 1px);background-size:24px 24px}.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}.row{display:flex;margin:5px 0 9px}.row.mine{justify-content:flex-end}.bubble{max-width:min(75%,590px);padding:10px 13px 8px;background:#fff;border:1px solid #e5ebf2;border-radius:19px 19px 19px 6px;box-shadow:0 3px 12px #183b640b;cursor:pointer}.mine .bubble{background:linear-gradient(135deg,var(--blue),var(--blue2));border:0;color:#fff;border-radius:19px 19px 6px 19px}.text{font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.meta{text-align:right;font-size:10px;opacity:.65;margin-top:5px}.img{display:block;max-width:min(340px,72vw);max-height:430px;border-radius:13px;object-fit:cover;cursor:pointer}.caption{margin-top:6px;white-space:pre-wrap}.replyQuote{font-size:11px;padding:6px 8px;border-left:3px solid #7db0ff;background:#ffffff1c;border-radius:7px;margin-bottom:7px;opacity:.9}.theirs .replyQuote{background:#f2f6fb;color:#687286;border-left-color:var(--blue)}.reaction-list{display:flex;gap:4px;margin-top:5px}.reaction{font-size:12px;background:#fff;color:#27364f;border:1px solid #dce5f0;border-radius:11px;padding:3px 7px}.typing{height:25px;padding:4px 19px;color:var(--blue);font-size:12px}.typing.hidden{visibility:hidden}.replyComposer{display:none;align-items:center;gap:8px;padding:8px 12px;backgr d="closeViewer" class="close">×</button><img id="viewerImg"></div><div id="sheet" class="sheet"><div class="sheetbox"><div id="sheetTitle" class="sheettitle"></div><div class="reactrow"><button data-r="❤️">❤️</button><button data-r="😂">😂</button><button data-r="👍">👍</button><button data-r="😮">😮</button><button data-r="😢">😢</button><button data-r="🔥">🔥</button></div><button id="reply" class="sheetbtn">↩ Reply</button><button id="copy" class="sheetbtn">⧉ Copy</button><button id="del" class="sheetbtn danger">🗑 Delete</button><button id="cancel" class="sheetbtn cancel">Cancel</button></div></div><div id="recipientModal" class="modal"><div class="modalbox"><div class="modalIcon">🔐</div><div class="modalTitle">Start a private chat</div><div class="modalText">Enter the other user's Gmail once. We'll securely connect this conversation and remember it, so you won't be asked again every time you log in.</div><input id="recipientEmail" class="emailInput" type="email" autocomplete="off" placeholder="otheruser@gmail.com"><div id="recipientError" class="error"></div><button id="startChat" class="modalBtn">Start encrypted chat</button><div class="modalHint">Your message will be encrypted on this device before it reaches Firebase.</div></div></div><script>const firebaseConfig={apiKey:"AIzaSyBEw7edw-jRq47N_d1fJUvBSVnROJ6eCcE",authDomain:"messanger-817c9.firebaseapp.com",databaseURL:"https://messanger-817c9-default-rtdb.firebaseio.com",projectId:"messanger-817c9",storageBucket:"messanger-817c9.appspot.com",messagingSenderId:"678307855723",appId:"1:678307855723:web:ac21ee338a71dd34f9602e",measurementId:"G-37SG00MKXC"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.database(),$=id=>document.getElementById(id);const avatars=['https://api.dicebear.com/9.x/bottts/svg?seed=one','https://api.dicebear.com/9.x/fun-emoji/svg?seed=two','https://api.dicebear.com/9.x/adventurer/svg?seed=three','https://api.dicebear.com/9.x/big-smile/svg?seed=four'];let me=null,partnerUid=null,partnerInfo=null,myKeys=null,partnerKey=null,chatListener=null,typingListener=null,onlineListener=null,actionTarget=null,replyTarget=null,file=null,typingTimer=null,notificationReady=false,seen=new Set(),initial=true;
function nameOf(u){let n=(u?.displayName||u?.email||'User').split('@')[0].replace(/[._-]+/g,' ').trim();return n.split(/\s+/).filter(Boolean).map(x=>x[0].toUpperCase()+x.slice(1).toLowerCase()).join(' ')||'User'}function avatarFor(uid){let h=0;for(const c of uid||'')h=(h*31+c.charCodeAt(0))>>>0;return avatars[h%avatars.length]}function b64(a){let s='';a.forEach(x=>s+=String.fromCharCode(x));return btoa(s)}function u64(s){const x=atob(s);return Uint8Array.from(x,c=>c.charCodeAt(0))}function ab64(x){return b64(new Uint8Array(x))}async function openKeys(){const d=await new Promise((res,rej)=>{const r=indexedDB.open('private-chat-keys-v2',1);r.onupgradeneeded=()=>r.result.createObjectStore('keys');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});myKeys=await new Promise((res,rej)=>{const q=d.transaction('keys','readonly').objectStore('keys').get('ecdh');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});if(!myKeys){myKeys=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},false,['deriveKey']);await new Promise((res,rej)=>{const q=d.transaction('keys','readwrite').objectStore('keys').put(myKeys,'ecdh');q.onsuccess=res;q.onerror=()=>rej(q.error)})}const pub=await crypto.subtle.exportKey('jwk',myKeys.publicKey);await db.ref('e2eeKeys/'+me.uid).update({publicKey:pub,updatedAt:firebase.database.ServerValue.TIMESTAMP})}async function derive(publicJwk){const pub=await crypto.subtle.importKey('jwk',publicJwk,{name:'ECDH',namedCurve:'P-256'},false,[]);return crypto.subtle.deriveKey({name:'ECDH',public:pub},myKeys.privateKey,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}async function encrypt(obj,key){const iv=crypto.getRandomValues(new Uint8Array(12));const pt=new TextEncoder().encode(JSON.stringify(obj));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,pt);return {iv:ab64(iv),ciphertext:ab64(ct)}}async function decrypt(m){try{const other=JSON.parse(m.uid===me.uid?m.recipientPublicKey:m.senderPublicKey);const key=await deriv function savePartner(){if(!partnerInfo)return;localStorage.setItem('lastChatPartner',JSON.stringify(partnerInfo))}function getSavedPartner(){try{return JSON.parse(localStorage.getItem('lastChatPartner')||'null')}catch(e){return null}}async function findUser(email){const s=await db.ref('users').orderByChild('email').equalTo(email.toLowerCase()).once('value');let found=null;s.forEach(x=>found={uid:x.key,...x.val()});return found}async function connectPartner(email){const found=await findUser(email.trim());if(!found){$('recipientError').textContent='User not found. Ask them to log in once first.';return false}if(found.uid===me.uid){$('recipientError').textContent='You cannot chat with your own account.';return false}const keySnap=await db.ref('e2eeKeys/'+found.uid+'/publicKey').once('value');if(!keySnap.val()){$('recipientError').textContent='That user has not registered a secure device yet. Ask them to open the app once.';return false}partnerUid=found.uid;partnerInfo={uid:found.uid,email:found.email||email.toLowerCase(),displayName:found.displayName||nameOf(found),photoURL:found.photoURL||avatarFor(found.uid)};partnerKey=keySnap.val();savePartner();$('recipientModal').classList.remove('show');renderHeader();subscribe();return true}async function restorePartner(){const p=getSavedPartner();if(!p?.uid)return false;const s=await db.ref('users/'+p.uid).once('value');const u=s.val();if(!u)return false;const k=await db.ref('e2eeKeys/'+p.uid+'/publicKey').once('value');if(!k.val())return false;partnerUid=p.uid;partnerInfo={...p,...u,uid:p.uid};partnerKey=k.val();renderHeader();subscribe();return true}
function renderHeader(){const a=$('avatar'),n=$('pname'),st=$('stat');a.src=partnerInfo?.photoURL||avatarFor(partnerUid||'none');n.textContent=partnerInfo?.displayName||'Private Chat';st.innerHTML=partnerUid?'<span class="dot online"></span>End-to-end encrypted 🔒':'<span class="dot"></span>Secure chat'}function build(){ $('root').innerHTML='<header class="header"><img id="avatar" class="avatar"><div class="person"><div id="pname" class="name">Private Chat</div><div id="stat" class="status"></div></div><div class="menu-wrap"><button id="more" class="more">⋯</button><div id="menu" class="menu hidden"><button id="newChat">＋ New private chat</button><button id="profile">⚙ My account</button><button id="notify">🔔 Enable notifications</button><button id="logout" class="logout">↪ Logout</button></div></div></header><main id="messages" class="messages"></main><div id="typing" class="typing hidden">Typing…</div><footer class="composer"><div id="replyComposer" class="replyComposer"><div id="replyComposerText" class="replyComposerText"></div><button id="replyComposerClose" class="replyComposerClose">×</button></div><div id="preview" class="preview"><img id="previewImg"><span id="previewName"></span><button id="clearFile" class="close">×</button></div><div class="composer-row"><input id="file" class="file" type="file" accept="image/*"><button id="attach" class="attach">＋</button><div class="input-wrap"><textarea id="input" class="input" rows="1" maxlength="4000" placeholder="Write a message…"></textarea></div><button id="send" class="send">➤</button></div></footer>';renderHeader();$('more').onclick=e=>{e.stopPropagation();$('menu').classList.toggle('hidden')};$('newChat').onclick=()=>{closeMenu();$('recipientEmail').value='';$('recipientError').textContent='';$('recipientModal').classList.add('show');setTimeout(()=>$('recipientEmail').focus(),80)};$('profile').onclick=()=>location.href='profile.html';$('notify').onclick=requestNotifications;$('logout').onclick=logout;$('attach').onclick=()=>$('file').click();$('file').onchange=chooseFile;$('clearFile').onclick=clearFile;$('send').onclick=send;$('input').oninput=handleInput;$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('closeViewer').onclick=closeViewer;$('cancel').onclick=closeSheet;$('reply').onclick=()=>{if(actionTarget){replyTarget=actionTarget;closeSheet();showReplyComposer();$('input').focus()}};$('replyComposerClose').onclick=clearReply;$('copy').onclick=()=>{if(actionTarget?.plain?.text)navigator.clipboard?.writeText(actionTarget.plain.text);closeSheet()};$('del').onclick=()=>{if(actionTarget?.uid===me.uid&&confirm('Delete this message?')){db.ref('chats/'+actionTarget.key).remove();closeSheet()}};document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>react(b.dataset.r));$('startChat').onclick=()=>connectPartner($('recipientEmail').value);$('recipientEmail').onkeydown=e=>{if(e.key==='Enter')connectPartner(e.target.value)};$('recipientModal').onclick=e=>{if(e.target===$('recipientModal'))e.stopPropagation()};document.addEventListener('click',closeMenu)}function closeMenu(){const m=$('menu');if(m)m.classList.add('hidden')}function showReplyComposer(){const q=replyTarget?.plain?.text||'Image';$('replyComposerText').innerHTML='<strong>Replying to</strong>'+escapeHtml(q);$('replyComposer').classList.add('show')}function clearReply(){replyTarget=null;if($('replyComposer'))$('replyComposer').classList.remove('show')}function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function closeSheet(){actionTarget=null;$('sheet').classList.remove('show')}function openViewer(src){$('viewerImg').src=src;$('viewer').classList.add('show')}function closeViewer(){$('viewer').classList.remove('show');$('viewerImg').removeAttribute('src')}
function renderMessage(m,plain){const row=document.createElement('div');row.className='row '+(m.uid===me.uid?'mine':'theirs');const b=document.createElement('div');b.className='bubble';b.onclick=()=>openActions({...m,plain});if(plain?.reply){const q=document.createElement('div');q.className='replyQuote';q.textContent='↩ '+(plain.reply.text||'Image');b.appendChild(q)}if(plain?.type==='image'&&plain.image){const im=document.createElement('img');im.className='img';im.src=plain.image;im.onclick=e=>{e.stopPropagation();openViewer(plain.image)};b.appendChild(im);if(plain.text){const c=document.createElement('div');c.className='caption';c.textContent=plain.text;b.appendChild(c)}}else{const t=document.createElement('div');t.className='text';t.textContent=plain?.text||'';b.appendChild(t)}const meta=document.createElement('div');meta.className='meta';meta.textContent=new Date(m.timestamp||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+(m.uid===me.uid?'  ✓✓':'');b.appendChild(meta);if(m.reaction){const rl=document.createElement('div');rl.className='reaction-list';const r=document.createElement('span');r.className='reaction';r.textContent=m.reaction;rl.appendChild(r);b.appendChild(rl)}row.appendChild(b);$('messages').appendChild(row)}async function subscribe(){if(chatListener)db.ref('chats').off('value',chatListener);if(!partnerUid)return;initial=true;seen=new Set();chatListener=async snap=>{const all=[];snap.forEach(x=>{const m=x.val();if(!m||!m.uid||m.uid===undefined)return;if(!((m.uid===me.uid&&m.recipientUid===partnerUid)||(m.uid===partnerUid&&m.recipientUid===me.uid)))return;all.push({...m,key:x.key})});all.sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));$('messages').innerHTML='';if(!all.length){$('messages').innerHTML='<div class="empty"><div><strong>Private conversation</strong><span>Messages are end-to-end encrypted.</span></div></div>';return}for(const m of all){let p=m.encrypted?await decrypt(m):{type:m.type||'text',text:m.message||'',image:m.ima
