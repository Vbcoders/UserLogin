function openViewer(s){E('viewerImg').src=s;E('viewer').classList.add('show')}function closeViewer(){E('viewer').classList.remove('show');E('viewerImg').removeAttribute('src')}
function sendMessage(){const i=E('messageInput'),text=i.value.trim(),rt=replyTarget?{key:replyTarget.key,uid:replyTarget.uid,name:replyTarget.name,message:replyTarget.message}:null;if(!text&&!file)return;if(file){compressImage(file).then(data=>push({type:'image',imageData:data,caption:text,replyTo:rt}));return}push({type:'text',message:text,replyTo:rt})}function push(data){db.ref('chats').push({...data,uid:currentUser.uid,senderName:displayName(currentUser),profilePicUrl:currentUser.photoURL||avatarFor(currentUser.uid),timestampMs:firebase.database.ServerValue.TIMESTAMP,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}).then(()=>{E('messageInput').value='';clearFile();cancelReply();handleInput()}).catch(e=>alert('Message could not be sent.\n\nFirebase: '+(e.code||e.message)))}
function compressImage(f){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{let w=i.width,h=i.height,m=1280;if(w>m||h>m){if(w>h){h=h*m/w;w=m}else{w=w*m/h;h=m}}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);resolve(c.toDataURL('image/jpeg',.82))};i.onerror=reject;i.src=r.result};r.onerror=reject;r.readAsDataURL(f)})}function chooseFile(e){file=e.target.files&&e.target.files[0];if(file){E('previewImg').src=URL.createObjectURL(file);E('previewName').textContent=file.name;E('preview').classList.add('show');updateSendButton()}}function clearFile(){file=null;E('fileInput').value='';E('preview').classList.remove('show');E('previewImg').removeAttribute('src');updateSendButton()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)setTyping(false)});window.addEventListener('beforeunload',()=>{setTyping(false);setOnline(false)});
</script>
