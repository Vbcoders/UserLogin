<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Private Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.2.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.2.1/firebase-database.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,Arial,sans-serif;background:#eef2f7;color:#172033}button,input,textarea{font:inherit}button{cursor:pointer}body{overflow:hidden}.app{height:100dvh;display:flex;justify-content:center;align-items:center;padding:18px}.chat{width:min(980px,100%);height:min(900px,100%);background:#fff;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(18,32,59,.16)}.header{height:72px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid #e8ecf2;background:#fff}.avatar{width:44px;height:44px;flex:none;border-radius:50%;object-fit:cover;background:#e9effb}.person{flex:1;min-width:0}.name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:12px;color:#7b8495;margin-top:3px}.status.online{color:#16a34a}.icon{border:0;background:transparent;color:#697386;width:40px;height:40px;border-radius:50%;font-size:23px}.messages{flex:1;overflow-y:auto;padding:20px;background:linear-gradient(180deg,#f8faff,#f2f5f9)}.empty{height:100%;display:grid;place-items:center;text-align:center;color:#7b8495}.empty strong{display:block;color:#172033;font-size:18px;margin-bottom:5px}.row{display:flex;margin:5px 0 9px}.row.mine{justify-content:flex-end}.bubble{max-width:min(72%,560px);padding:10px 12px 7px;border-radius:18px;background:#fff;border:1px solid #edf0f4;box-shadow:0 2px 8px rgba(20,40,80,.05)}.mine .bubble{background:#2563eb;color:#fff;border:0;border-bottom-right-radius:5px}.theirs .bubble{border-bottom-left-radius:5px}.sender{font-size:11px;font-weight:700;color:#2563eb;margin-bottom:4px}.text{font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.meta{display:flex;justify-content:flex-end;gap:5px;margin-top:3px;font-size:10px;opacity:.68}.checks{font-size:12px}.msg-image{display:block;width:min(340px,65vw);max-height:430px;object-fit:cover;border-radius:13px;cursor:pointer}.caption{margin-top:7px;white-space:pre-wrap;overflow-wrap:anywhere}.typing{height:22px;padding:0 21px;font-size:12px;color:#7b8495}.hidden{display:none!important}.composer{position:relative;flex:none;display:flex;align-items:flex-end;gap:8px;padding:10px 13px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #e8ecf2;background:#fff}.attach{width:42px;height:42px;border:0;border-radius:50%;background:#f0f3f8;color:#536079;font-size:24px}.input-wrap{flex:1;background:#f1f4f8;border-radius:22px}.input{display:block;width:100%;min-height:42px;max-height:130px;resize:none;border:0;outline:0;background:transparent;padding:11px 14px;font-size:15px}.send{width:42px;height:42px;border:0;border-radius:50%;background:#2563eb;color:#fff;font-size:18px;transition:.15s}.send:disabled{opacity:.35;cursor:default}.preview{display:none;position:absolute;left:13px;right:13px;bottom:72px;background:#fff;border:1px solid #e4e8ef;border-radius:14px;padding:8px;box-shadow:0 12px 35px rgba(0,0,0,.14);align-items:center;gap:9px}.preview.show{display:flex}.preview img{width:62px;height:62px;border-radius:10px;object-fit:cover}.preview span{flex:1;font-size:12px;color:#687286;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.close{border:0;background:#f0f3f7;border-radius:50%;width:30px;height:30px}.file{display:none}.join{width:min(420px,100%);background:#fff;border-radius:24px;padding:30px;box-shadow:0 20px 60px rgba(18,32,59,.16)}.join h1{margin:0 0 7px}.join p{margin:0 0 20px;color:#7b8495}.join input{width:100%;height:48px;border:1px solid #dce2eb;border-radius:12px;padding:0 14px;outline:0}.join button{width:100%;height:48px;margin-top:12px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:700}@media(max-width:650px){.app{padding:0}.chat{width:100%;height:100dvh;border-radius:0}.header{height:68px}.messages{padding:15px 11px 20px}.bubble{max-width:84%}.msg-image{width:min(300px,78vw)}}
</style>
</head>
<body>
<div class="app"><div id="root" class="chat"></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyBEw7edw-jRq47N_d1fJUvBSVnROJ6eCcE",authDomain:"messanger-817c9.firebaseapp.com",databaseURL:"https://messanger-817c9-default-rtdb.firebaseio.com",projectId:"messanger-817c9",storageBucket:"messanger-817c9.appspot.com",messagingSenderId:"678307855723",appId:"1:678307855723:web:ac21ee338a71dd34f9602e"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
let name=localStorage.getItem('name')||'',file=null,typingTimer=null,partnerName='Private Chat',partnerPhoto='';
const $=id=>document.getElementById(id);
const fallbackAvatar='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><circle cx="40" cy="40" r="40" fill="#e9effb"/><text x="40" y="50" text-anchor="middle" font-size="28" fill="#2563eb">P</text></svg>');
function join(){root.className='join';root.innerHTML='<h1>Private Chat</h1><p>Continue with your existing account name.</p><input id="jn" maxlength="40" placeholder="Your name"><button id="jb">Continue</button>';jn.value=name;jb.onclick=()=>{let n=jn.value.trim();if(!n)return;name=n;localStorage.setItem('name',n);chat()}}
function chat(){root.className='chat';root.innerHTML='<header class="header"><img id="avatar" class="avatar"><div class="person"><div id="pname" class="name">Private Chat</div><div id="stat" class="status">Live conversation</div></div><button id="clear" class="icon" title="Delete my messages">⋯</button></header><main id="messages" class="messages"></main><div id="typing" class="typing hidden">typing…</div><footer class="composer"><div id="preview" class="preview"><img id="previewImg"><span id="previewName"></span><button id="close" class="close">×</button></div><input id="fileInput" class="file" type="file" accept="image/*"><button id="attach" class="attach" title="Send image">＋</button><div class="input-wrap"><textarea id="input" class="input" rows="1" maxlength="4000" placeholder="Message…"></textarea></div><button id="send" class="send" disabled title="Send message">➤</button></footer>';avatar.src=fallbackAvatar;pname.textContent=partnerName;attach.onclick=()=>fileInput.click();fileInput.onchange=chooseFile;close.onclick=clearFile;send.onclick=send;input.oninput=inputChanged;input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};clear.onclick=deleteMine;listen();listenTyping()}
function updatePartnerHeader(m){if(!m||m.name===name)return;partnerName=m.name||'Private Chat';partnerPhoto=m.profilePicUrl||m.photoUrl||m.avatar||localStorage.getItem('chatPartnerPhoto')||'';pname.textContent=partnerName;avatar.src=partnerPhoto||fallbackAvatar;stat.textContent='Active conversation';}
function inputChanged(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,130)+'px';send.disabled=!(input.value.trim()||file);setTyping(!!input.value.trim())}
function setTyping(v){db.ref('presence/typing/'+encodeURIComponent(name)).set(v);clearTimeout(typingTimer);if(v)typingTimer=setTimeout(()=>db.ref('presence/typing/'+encodeURIComponent(name)).set(false),1600)}
function listenTyping(){db.ref('presence/typing').on('value',s=>{let x=s.val()||{};let active=Object.keys(x).some(k=>decodeURIComponent(k)!==name&&x[k]);typing.classList.toggle('hidden',!active)})}
function listen(){db.ref('chats').on('value',s=>{let a=Object.entries(s.val()||{}).map(([id,v])=>({...v,id})).filter(v=>v&&v.name).sort((a,b)=>(a.timestampMs||0)-(b.timestampMs||0));messages.innerHTML='';if(!a.length){messages.innerHTML='<div class="empty"><div><strong>Private conversation</strong><span>Send a message to start.</span></div></div>';return}let incoming=a.filter(v=>v.name!==name);if(incoming.length)updatePartnerHeader(incoming[incoming.length-1]);a.forEach(add);requestAnimationFrame(()=>messages.scrollTop=messages.scrollHeight)})}
function add(m){let row=document.createElement('div');row.className='row '+(m.name===name?'mine':'theirs');let b=document.createElement('div');b.className='bubble';if(m.name!==name){let s=document.createElement('div');s.className='sender';s.textContent=m.name;b.appendChild(s)}if(m.type==='image'&&m.imageData){let im=document.createElement('img');im.className='msg-image';im.src=m.imageData;im.loading='lazy';im.onclick=()=>window.open(m.imageData,'_blank');b.appendChild(im);if(m.caption){let c=document.createElement('div');c.className='caption';c.textContent=m.caption;b.appendChild(c)}}else{let t=document.createElement('div');t.className='text';t.textContent=m.message||'';b.appendChild(t)}let meta=document.createElement('div');meta.className='meta';meta.textContent=m.time||new Date(m.timestampMs||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});if(m.name===name)meta.innerHTML+=' <span class="checks">✓✓</span>';b.appendChild(meta);row.appendChild(b);messages.appendChild(row)}
function send(){let text=input.value.trim();if(!text&&!file)return;if(file){compressImage(file).then(data=>push({type:'image',imageData:data,caption:text})).catch(e=>{console.error(e);alert('Could not prepare the image. Please choose another image.')});return}push({type:'text',message:text})}
function push(o){send.disabled=true;return db.ref('chats').push({...o,name,profilePicUrl:localStorage.getItem('profilePicUrl')||'',timestampMs:firebase.database.ServerValue.TIMESTAMP,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}).then(()=>{input.value='';clearFile();inputChanged();setTyping(false)}).catch(e=>{console.error(e);alert('Message could not be sent. Please check your Firebase Realtime Database rules.');inputChanged()})}
function compressImage(f){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=1280;let w=img.width,h=img.height;if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);resolve(canvas.toDataURL('image/jpeg',.72))};img.src=reader.result};reader.readAsDataURL(f)})}
function chooseFile(){let f=fileInput.files[0];if(!f)return;if(!f.type.startsWith('image/'))return alert('Please select an image.');if(f.size>15*1024*1024)return alert('Please choose an image smaller than 15 MB.');file=f;previewImg.src=URL.createObjectURL(f);previewName.textContent=f.name;preview.classList.add('show');inputChanged()}
function clearFile(){file=null;fileInput.value='';preview.classList.remove('show');previewImg.removeAttribute('src');previewName.textContent='';if(typeof send!=='undefined')send.disabled=!input.value.trim()}
function deleteMine(){if(!confirm('Delete all messages sent by you?'))return;db.ref('chats').once('value',s=>{let updates={};Object.entries(s.val()||{}).forEach(([k,v])=>{if(v&&v.name===name)updates[k]=null});if(Object.keys(updates).length)db.ref('chats').update(updates)})}
if(name)chat();else join();
</script>
</body>
</html>
