<style>
:root{--bg:#070b14;--line:#202b40;--text:#f5f7fb;--muted:#8995aa;--blue:#5b7cff;--blue2:#7b5cff;--green:#35d07f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 20% 0%,#182345 0,#0b1020 34%,#060910 100%);color:var(--text);touch-action:manipulation}body{visibility:hidden}body.ready{visibility:visible}.app{height:100dvh;display:flex;align-items:center;justify-content:center;padding:18px}.chat{width:min(1080px,100%);height:min(920px,100%);display:flex;flex-direction:column;overflow:hidden;border:1px solid #ffffff12;border-radius:28px;background:#0a0f1bf2;box-shadow:0 30px 90px #000b,0 0 0 1px #ffffff06;backdrop-filter:blur(24px)}
.header{height:82px;display:flex;align-items:center;gap:13px;padding:0 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#11192a,#0c1321);flex:none}.avatar-ring{width:48px;height:48px;padding:2px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));flex:none}.avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#182238;display:block}.person{flex:1;min-width:0}.name{font-size:16px;font-weight:750;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{display:flex;align-items:center;gap:6px;margin-top:4px;min-height:16px;color:var(--muted);font-size:12px}.online-dot,.offline-dot{width:7px;height:7px;border-radius:50%;display:inline-block}.online-dot{background:var(--green);box-shadow:0 0 0 3px #35d07f18,0 0 10px #35d07f99}.offline-dot{background:#647084}.menu-wrap{position:relative}.icon{width:42px;height:42px;border:1px solid #ffffff0c;border-radius:13px;background:#ffffff08;color:#dbe3f3;font-size:24px;cursor:pointer}.menu{position:absolute;right:0;top:50px;width:190px;padding:7px;border:1px solid #ffffff14;border-radius:16px;background:#111a2b;box-shadow:0 20px 50px #0009;z-index:100}.menu.hidden{display:none!important}.menu button{width:100%;border:0;border-radius:11px;background:transparent;color:#edf2fb;text-align:left;padding:12px 13px;font-size:14px;cursor:pointer}.menu button:hover{background:#ffffff09}.logout{color:#ff7383!important}
.messages{flex:1;overflow-y:auto;padding:24px 22px 18px;background:radial-gradient(circle at 50% 0%,#17233a55,transparent 45%),linear-gradient(180deg,#0a101c,#080d17)}.messages::-webkit-scrollbar{width:6px}.messages::-webkit-scrollbar-thumb{background:#ffffff18;border-radius:8px}.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted)}.empty-card{padding:30px 36px;border:1px solid #ffffff0c;border-radius:24px;background:#ffffff04}.empty-logo{width:54px;height:54px;margin:0 auto 14px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--blue2));font-size:24px;box-shadow:0 12px 35px #5b7cff33}.empty strong{display:block;color:#fff;font-size:18px;margin-bottom:6px}.empty span{font-size:13px}.day-label{width:max-content;margin:4px auto 15px;padding:6px 11px;border-radius:20px;background:#ffffff07;color:#718098;font-size:10px;text-transform:uppercase;letter-spacing:1px}.row{display:flex;margin:6px 0 10px;animation:pop .16s ease-out}.row.mine{justify-content:flex-end}.bubble-wrap{position:relative;max-width:min(72%,600px)}.bubble{padding:11px 13px 8px;border:1px solid #ffffff0b;border-radius:20px;background:linear-gradient(145deg,#151f31,#111a29);box-shadow:0 5px 18px #0002}.mine .bubble{background:linear-gradient(135deg,#5a76ff,#6557e9);border:0;border-bottom-right-radius:6px;box-shadow:0 8px 22px #536cff2b}.theirs .bubble{border-bottom-left-radius:6px}.sender{font-size:11px;font-weight:700;color:#8ea4ff;margin-bottom:5px}.text{font-size:15px;line-height:1.48;white-space:pre-wrap;overflow-wrap:anywhere}.meta{display:flex;justify-content:flex-end;gap:5px;margin-top:4px;font-size:10px;color:#bfc8dc;opacity:.72}.mine .meta{color:#eef1ff}.msg-image{display:block;width:min(360px,66vw);max-height:460px;object-fit:cover;border-radius:15px;cursor:pointer;user-select:none;-webkit-user-drag:none}.caption{margin-top:7px;white-space:pre-wrap;line-height:1.4}.delete-btn{display:none;position:absolute;right:7px;top:-34px;border:1px solid #ffffff10;background:#141c2b;color:#ff7786;font-size:11px;padding:7px 10px;border-radius:10px;box-shadow:0 8px 25px #0007;cursor:pointer}.row.mine:hover .delete-btn{display:block}.typing{height:22px;padding:0 22px;font-size:12px;color:#6f9aff;flex:none}.typing.hidden{visibility:hidden}
.composer{position:relative;display:flex;align-items:flex-end;gap:9px;padding:11px 14px calc(11px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:linear-gradient(180deg,#0d1523,#0a111d);flex:none}.attach,.send{width:44px;height:44px;border:0;border-radius:15px;cursor:pointer;flex:none}.attach{background:#ffffff08;color:#b8c2d6;font-size:24px}.input-wrap{flex:1;min-width:0;background:#121b2b;border:1px solid #ffffff0b;border-radius:18px}.input{display:block;width:100%;min-height:44px;max-height:130px;resize:none;border:0;outline:0;background:transparent;color:#f5f7fb;padding:11px 14px;font-size:15px;line-height:1.4}.input::placeholder{color:#68758b}.send{background:linear-gradient(135deg,var(--blue),var(--blue2));color:white;font-size:18px;opacity:.35;box-shadow:0 8px 22px #5b7cff22}.send.ready{opacity:1}.send:active,.attach:active{transform:scale(.94)}.preview{display:none;position:absolute;left:14px;right:14px;bottom:78px;align-items:center;gap:10px;padding:9px;border:1px solid #ffffff12;border-radius:16px;background:#111a2b;box-shadow:0 18px 50px #0009}.preview.show{display:flex}.preview img{width:58px;height:58px;border-radius:11px;object-fit:cover}.preview span{flex:1;min-width:0;color:#aeb9cc;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.close{width:30px;height:30px;border:0;border-radius:50%;background:#ffffff0a;color:#d8deeb;cursor:pointer}.file{display:none}.viewer{position:fixed;inset:0;background:#02040aef;z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(12px)}.viewer.show{display:flex}.viewer img{max-width:96vw;max-height:90vh;object-fit:contain;border-radius:14px;box-shadow:0 25px 80px #000}.viewer-close{position:absolute;right:18px;top:16px;width:44px;height:44px;border:1px solid #ffffff18;border-radius:50%;background:#ffffff12;color:#fff;font-size:28px;cursor:pointer}@keyframes pop{from{opacity:0;transform:translateY(5px) scale(.99)}to{opacity:1;transform:none}}@media(max-width:650px){.app{padding:0}.chat{width:100%;height:100dvh;border-radius:0;border:0}.header{height:72px;padding:0 13px}.messages{padding:17px 10px 12px}.bubble-wrap{max-width:84%}.msg-image{width:min(310px,78vw)}.delete-btn{display:block;position:static;margin:5px 0 0 auto;background:transparent;box-shadow:none;border:0;padding:2px 0}.composer{padding-left:10px;padding-right:10px}.attach,.send{width:42px;height:42px}.input{font-size:16px}}
</style>
</head>
<body>
<div class="app"><div id="root" class="chat"></div></div><div id="viewer" class="viewer"><button id="viewerClose" class="viewer-close">×</button><img id="viewerImg" alt="Image"></div>
<script>
const firebaseConfig={apiKey:"AIzaSyBEw7edw-jRq47N_d1fJUvBSVnROJ6eCcE",authDomain:"messanger-817c9.firebaseapp.com",databaseURL:"https://messanger-817c9-default-rtdb.firebaseio.com",projectId:"messanger-817c9",storageBucket:"messanger-817c9.appspot.com",messagingSenderId:"678307855723",appId:"1:678307855723:web:ac21ee338a71dd34f9602e",measurementId:"G-37SG00MKXC"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.database();let currentUser=null,file=null,typingTimer=null,partnerUid=null;const E=id=>document.getElementById(id);const fallback='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" rx="50" fill="#182238"/><text x="50" y="62" text-anchor="middle" font-size="34" fill="#8ea4ff">P</text></svg>');
function displayName(u){return u.displayName||u.email||'User'}function showLogin(){window.location.replace('index.html')}
auth.onAuthStateChanged(u=>{if(!u){showLogin();return}currentUser=u;chat();document.body.classList.add('ready');setOnline(true)});
function chat(){E('root').innerHTML='<header class="header"><div class="avatar-ring"><img id="avatar" class="avatar"></div><div class="person"><div id="pname" class="name">Private Chat</div><div id="stat" class="status"><span class="offline-dot"></span>Connecting…</div></div><div class="menu-wrap"><button id="menuBtn" class="icon" aria-label="Menu">⋯</button><div id="menu" class="menu hidden"><button id="myProfile">My account</button><button id="logoutBtn" class="logout">Logout</button></div></div></header><main id="messages" class="messages"></main><div id="typing" class="typing hidden">typing…</div><footer class="composer"><div id="preview" class="preview"><img id="previewImg"><span id="previewName"></span><button id="closePreview" class="close">×</button></div><input id="fileInput" class="file" type="file" accept="image/*"><button id="attachBtn" class="attach" aria-label="Attach image">＋</button><div class="input-wrap"><textarea id="messageInput" class="input" rows="1" maxlength="4000" placeholder="Write a private message…"></textarea></div><button id="sendBtn" class="send" type="button" aria-label="Send">➤</button></footer>';E('avatar').src=fallback;E('menuBtn').onclick=e=>{e.stopPropagation();E('menu').classList.toggle('hidden')};document.addEventListener('click',closeMenu);E('myProfile').onclick=()=>{alert('Signed in as: '+displayName(currentUser));closeMenu()};E('logoutBtn').onclick=logout;E('attachBtn').onclick=()=>E('fileInput').click();E('fileInput').onchange=chooseFile;E('closePreview').onclick=clearFile;E('sendBtn').onclick=sendMessage;E('messageInput').oninput=handleInput;E('messageInput').onblur=()=>setTyping(false);E('messageInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}};E('viewerClose').onclick=closeViewer;E('viewer').onclick=e=>{if(e.target===E('viewer'))closeViewer()};listenMessages();listenPresence();listenTyping();updateSendButton()}
function closeMenu(){const m=E('menu');if(m)m.classList.add('hidden')}function setOnline(v){if(!currentUser)return;const r=db.ref('presence/online/'+currentUser.uid);if(v){r.set(true).catch(()=>{});r.onDisconnect().remove().catch(()=>{})}else r.remove().catch(()=>{})}function setTyping(v){if(!currentUser)return;const r=db.ref('presence/typing/'+currentUser.uid);clearTimeout(typingTimer);if(v){r.set({active:true,ts:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{});r.onDisconnect().set({active:false,ts:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{});typingTimer=setTimeout(()=>setTyping(false),2200)}else{r.set({active:false,ts:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{});r.onDisconnect().remove().catch(()=>{})}}function logout(){closeMenu();setTyping(false);setOnline(false);auth.signOut().then(()=>{localStorage.clear();showLogin()}).catch(e=>alert('Logout failed: '+e.message))}function updateSendButton(){E('sendBtn').classList.toggle('ready',!!(E('messageInput').value.trim()||file))}function handleInput(){const i=E('messageInput');i.style.height='auto';i.style.height=Math.min(i.scrollHeight,130)+'px';updateSendButton();setTyping(!!i.value.trim())}
function listenTyping(){db.ref('presence/typing').on('value',s=>{const x=s.val()||{},raw=partnerUid?x[partnerUid]:null,active=!!raw&&(raw===true||raw.active===true),ts=raw&&raw.ts?Number(raw.ts):0,fresh=!ts||Date.now()-ts<3500,yes=active&&fresh;E('typing').classList.toggle('hidden',!yes);if(yes)E('stat').innerHTML='<span class="online-dot"></span>typing…';else refreshStatus()})}function refreshStatus(){db.ref('presence/online').once('value').then(s=>{const x=s.val()||{};E('stat').innerHTML=partnerUid&&x[partnerUid]?'<span class="online-dot"></span>Active now':'<span class="offline-dot"></span>Offline'})}function listenPresence(){db.ref('presence/online').on('value',()=>{if(E('typing').classList.contains('hidden'))refreshStatus()})}
function listenMessages(){db.ref('chats').on('value',s=>{const list=[];s.forEach(c=>{const v=c.val();if(v&&v.uid)list.push({...v,_key:c.key})});list.sort((a,b)=>(a.timestampMs||0)-(b.timestampMs||0));const incoming=list.filter(v=>v.uid!==currentUser.uid);if(incoming.length){const m=incoming[incoming.length-1];partnerUid=m.uid;E('pname').textContent=m.senderName||'User';E('avatar').src=m.profilePicUrl||fallback;refreshStatus()}E('messages').innerHTML='';if(!list.length){E('messages').innerHTML='<div class="empty"><div class="empty-card"><div class="empty-logo">✦</div><strong>Private conversation</strong><span>Your messages stay in this chat.</span></div></div>';return}E('messages').insertAdjacentHTML('beforeend','<div class="day-label">Private conversation</div>');list.forEach(addMessage);requestAnimationFrame(()=>E('messages').scrollTop=E('messages').scrollHeight)})}
function addMessage(m){const row=document.createElement('div');row.className='row '+(m.uid===currentUser.uid?'mine':'theirs');const wrap=document.createElement('div');wrap.className='bubble-wrap';const b=document.createElement('div');b.className='bubble';if(m.uid!==currentUser.uid){const s=document.createElement('div');s.className='sender';s.textContent=m.senderName||'User';b.appendChild(s)}if(m.type==='image'&&m.imageData){const im=document.createElement('img');im.className='msg-image';im.src=m.imageData;im.onclick=()=>openViewer(m.imageData);im.oncontextmenu=e=>e.preventDefault();b.appendChild(im);if(m.caption){const c=document.createElement('div');c.className='caption';c.textContent=m.caption;b.appendChild(c)}}else{const t=document.createElement('div');t.className='text';t.textContent=m.message||'';b.appendChild(t)}const meta=document.createElement('div');meta.className='meta';meta.textContent=m.time||new Date(m.timestampMs||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});if(m.uid===currentUser.uid)meta.textContent+=' ✓✓';b.appendChild(meta);if(m.uid===currentUser.uid){const d=document.createElement('button');d.className='delete-btn';d.textContent='Delete';d.onclick=()=>deleteMessage(m._key);wrap.appendChild(d)}wrap.appendChild(b);row.appendChild(wrap);E('messages').appendChild(row)}function deleteMessage(k){if(!k)return;if(!confirm('Delete this message?'))return;db.ref('chats/'+k).remove().catch(e=>alert('Could not delete message: '+e.message))}function openViewer(src){E('viewerImg').src=src;E('viewer').classList.add('show')}function closeViewer(){E('viewer').classList.remove('show');E('viewerImg').removeAttribute('src')}
function sendMessage(){const i=E('messageInput'),text=i.value.trim();if(!text&&!file){setTyping(false);return}setTyping(false);if(file){compressImage(file).then(data=>pushMessage({type:'image',imageData:data,caption:text})).catch(()=>alert('Could not prepare the image.'));return}pushMessage({type:'text',message:text})}function pushMessage(data){if(!currentUser)return;db.ref('chats').push({...data,uid:currentUser.uid,senderName:displayName(currentUser),profilePicUrl:currentUser.photoURL||'',timestampMs:firebase.database.ServerValue.TIMESTAMP,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}).then(()=>{E('messageInput').value='';clearFile();handleInput();setTyping(false)}).catch(e=>{alert('Message could not be sent.\n\nFirebase: '+(e.code||'unknown')+'\n'+(e.message||''));updateSendButton()})}function compressImage(f){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=reject;r.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{let w=img.width,h=img.height,max=1280;if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',.72))};img.src=r.result};r.readAsDataURL(f)})}function chooseFile(){const f=E('fileInput').files[0];if(!f)return;if(!f.type.startsWith('image/'))return alert('Please select an image.');if(f.size>15*1024*1024)return alert('Please choose an image smaller than 15 MB.');file=f;E('previewImg').src=URL.createObjectURL(f);E('previewName').textContent=f.name;E('preview').classList.add('show');updateSendButton()}function clearFile(){file=null;E('fileInput').value='';E('preview').classList.remove('show');E('previewImg').removeAttribute('src');E('previewName').textContent='';updateSendButton()}
document.addEventListener('contextmenu',e=>{if(e.target.closest('.msg-image'))e.preventDefault()});document.addEventListener('dragstart',e=>{if(e.target.tagName==='IMG')e.preventDefault()});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&(e.key==='+'||e.key==='-'||e.key==='='||e.key==='0'))e.preventDefault()});
</script></body></html>
