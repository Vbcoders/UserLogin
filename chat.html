<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Private Chat</title><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#eef2f7;color:#172033}body{overflow:hidden;visibility:hidden}body.ready{visibility:visible}.app{height:100dvh;display:flex;justify-content:center;align-items:center;padding:18px}.chat{width:min(980px,100%);height:min(900px,100%);background:#fff;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(18,32,59,.16)}.header{height:72px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid #e8ecf2}.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#e9effb}.person{flex:1;min-width:0}.name{font-size:15px;font-weight:700}.status{font-size:12px;color:#7b8495;margin-top:3px}.menu-wrap{position:relative}.icon{border:0;background:transparent;color:#697386;width:40px;height:40px;font-size:23px}.menu{position:absolute;right:0;top:48px;width:150px;background:#fff;border:1px solid #e5e9ef;border-radius:12px;box-shadow:0 12px 35px #0002;padding:6px;z-index:20}.menu button{width:100%;border:0;background:#fff;text-align:left;padding:11px;border-radius:8px}.logout{color:#dc2626}.messages{flex:1;overflow-y:auto;padding:20px;background:linear-gradient(#f8faff,#f2f5f9)}.empty{height:100%;display:grid;place-items:center;text-align:center;color:#7b8495}.empty strong{display:block;color:#172033;font-size:18px;margin-bottom:5px}.row{display:flex;margin:5px 0 9px}.row.mine{justify-content:flex-end}.bubble{max-width:min(72%,560px);padding:10px 12px 7px;border-radius:18px;background:#fff;border:1px solid #edf0f4;box-shadow:0 2px 8px rgba(20,40,80,.05)}.mine .bubble{background:#2563eb;color:#fff;border:0;border-bottom-right-radius:5px}.theirs .bubble{border-bottom-left-radius:5px}.sender{font-size:11px;font-weight:700;color:#2563eb;margin-bottom:4px}.text{font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.meta{display:flex;justify-content:flex-end;gap:5px;margin-top:3px;font-size:10px;opacity:.68}.msg-image{display:block;width:min(340px,65vw);max-height:430px;object-fit:cover;border-radius:13px;cursor:pointer}.caption{margin-top:7px;white-space:pre-wrap}.typing{height:22px;padding:0 21px;font-size:12px;color:#7b8495}.hidden{display:none!important}.composer{position:relative;display:flex;align-items:flex-end;gap:8px;padding:10px 13px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #e8ecf2;background:#fff}.attach{width:42px;height:42px;border:0;border-radius:50%;background:#f0f3f8;color:#536079;font-size:24px}.input-wrap{flex:1;background:#f1f4f8;border-radius:22px}.input{display:block;width:100%;min-height:42px;max-height:130px;resize:none;border:0;outline:0;background:transparent;padding:11px 14px;font-size:15px}.send{width:42px;height:42px;border:0;border-radius:50%;background:#2563eb;color:#fff;font-size:18px;opacity:.35;cursor:pointer}.send.ready{opacity:1}.preview{display:none;position:absolute;left:13px;right:13px;bottom:72px;background:#fff;border:1px solid #e4e8ef;border-radius:14px;padding:8px;box-shadow:0 12px 35px rgba(0,0,0,.14);align-items:center;gap:9px}.preview.show{display:flex}.preview img{width:62px;height:62px;border-radius:10px;object-fit:cover}.preview span{flex:1;font-size:12px;color:#687286}.close{border:0;background:#f0f3f7;border-radius:50%;width:30px;height:30px}.file{display:none}@media(max-width:650px){.app{padding:0}.chat{width:100%;height:100dvh;border-radius:0}.messages{padding:15px 11px 20px}.bubble{max-width:84%}.msg-image{width:min(300px,78vw)}} </style></head><body><div class="app"><div id="root" class="chat"></div></div><script>const firebaseConfig={apiKey:"AIzaSyBEw7edw-jRq47N_d1fJUvBSVnROJ6eCcE",authDomain:"messanger-817c9.firebaseapp.com",databaseURL:"https://messanger-817c9-default-rtdb.firebaseio.com",projectId:"messanger-817c9",storageBucket:"messanger-817c9.appspot.com",messagingSenderId:"678307855723",appId:"1:678307855723:web:ac21ee338a71dd34f9602e",measurementId:"G-37SG00MKXC"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.database();let currentUser=null,file=null,typingTimer=null,partner={name:'Private Chat',photo:''};const fallback='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><circle cx="40" cy="40" r="40" fill="#e9effb"/><text x="40" y="50" text-anchor="middle" font-size="28" fill="#2563eb">P</text></svg>');const E=id=>document.getElementById(id);function displayName(u){return u.displayName||u.email||'User'}function showLogin(){window.location.replace('index.html')}auth.onAuthStateChanged(u=>{if(u){currentUser=u;localStorage.removeItem('name');localStorage.removeItem('profilePicUrl');chat();document.body.classList.add('ready')}else{showLogin()}});function chat(){E('root').innerHTML='<header class="header"><img id="avatar" class="avatar"><div class="person"><div id="pname" class="name">Private Chat</div><div id="stat" class="status">Live conversation</div></div><div class="menu-wrap"><button id="menuBtn" class="icon">⋯</button><div id="menu" class="menu hidden"><button id="myProfile">My account</button><button id="logoutBtn" class="logout">Logout</button></div></div></header><main id="messages" class="messages"></main><div id="typing" class="typing hidden">typing…</div><footer class="composer"><div id="preview" class="preview"><img id="previewImg"><span id="previewName"></span><button id="closePreview" class="close">×</button></div><input id="fileInput" class="file" type="file" accept="image/*"><button id="attachBtn" class="attach">＋</button><div class="input-wrap"><textarea id="messageInput" class="input" rows="1" maxlength="4000" placeholder="Message…"></textarea></div><button id="sendBtn" class="send" type="button">➤</button></footer>';E('avatar').src=partner.photo||fallback;E('menuBtn').onclick=()=>E('menu').classList.toggle('hidden');E('myProfile').onclick=()=>alert('Signed in as: '+displayName(currentUser));E('logoutBtn').onclick=logout;E('attachBtn').onclick=()=>E('fileInput').click();E('fileInput').onchange=chooseFile;E('closePreview').onclick=clearFile;E('sendBtn').onclick=sendMessage;E('messageInput').oninput=handleInput;E('messageInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}};listenMessages();listenTyping();updateSendButton()}function logout(){db.ref('presence/typing/'+currentUser.uid).remove().catch(()=>{});auth.signOut().then(()=>{localStorage.clear();showLogin()}).catch(e=>alert('Logout failed: '+e.message))}function updateSendButton(){E('sendBtn').classList.toggle('ready',!!(E('messageInput').value.trim()||file))}function handleInput(){const i=E('messageInput');i.style.height='auto';i.style.height=Math.min(i.scrollHeight,130)+'px';updateSendButton();setTyping(!!i.value.trim())}function setTyping(v){if(!currentUser)return;db.ref('presence/typing/'+currentUser.uid).set(v).catch(()=>{});clearTimeout(typingTimer);if(v)typingTimer=setTimeout(()=>db.ref('presence/typing/'+currentUser.uid).set(false).catch(()=>{}),1600)}function listenTyping(){db.ref('presence/typing').on('value',s=>{const x=s.val()||{};E('typing').classList.toggle('hidden',!Object.keys(x).some(k=>k!==currentUser.uid&&x[k]))})}function listenMessages(){db.ref('chats').on('value',s=>{const a=Object.values(s.val()||{}).filter(v=>v&&v.uid).sort((a,b)=>(a.timestampMs||0)-(b.timestampMs||0));E('messages').innerHTML='';if(!a.length){E('messages').innerHTML='<div class="empty"><div><strong>Private conversation</strong><span>Send a message to start.</span></div></div>';return}const incoming=a.filter(v=>v.uid!==currentUser.uid);if(incoming.length){const m=incoming[incoming.length-1];partner={name:m.senderName||'User',photo:m.profilePicUrl||''};E('pname').textContent=partner.name;E('stat').textContent='Active conversation';E('avatar').src=partner.photo||fallback}a.forEach(addMessage);requestAnimationFrame(()=>E('messages').scrollTop=E('messages').scrollHeight)})}function addMessage(m){const row=document.createElement('div');row.className='row '+(m.uid===currentUser.uid?'mine':'theirs');const b=document.createElement('div');b.className='bubble';if(m.uid!==currentUser.uid){const s=document.createElement('div');s.className='sender';s.textContent=m.senderName||'User';b.appendChild(s)}if(m.type==='image'&&m.imageData){const im=document.createElement('img');im.className='msg-image';im.src=m.imageData;im.onclick=()=>window.open(m.imageData,'_blank');b.appendChild(im);if(m.caption){const c=document.createElement('div');c.className='caption';c.textContent=m.caption;b.appendChild(c)}}else{const t=document.createElement('div');t.className='text';t.textContent=m.message||'';b.appendChild(t)}const meta=document.createElement('div');meta.className='meta';meta.textContent=m.time||new Date(m.timestampMs||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});if(m.uid===currentUser.uid)meta.innerHTML+=' ✓✓';b.appendChild(meta);row.appendChild(b);E('messages').appendChild(row)}function sendMessage(){const i=E('messageInput'),text=i.value.trim();if(!text&&!file)return;if(file){compressImage(file).then(data=>pushMessage({type:'image',imageData:data,caption:text})).catch(()=>alert('Could not prepare the image.'));return}pushMessage({type:'text',message:text})}function pushMessage(data){if(!currentUser){alert('Secure session is not ready. Please wait a moment.');return}db.ref('chats').push({...data,uid:currentUser.uid,senderName:displayName(currentUser),profilePicUrl:currentUser.photoURL||'',timestampMs:firebase.database.ServerValue.TIMESTAMP,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}).then(()=>{E('messageInput').value='';clearFile();handleInput();setTyping(false)}).catch(e=>{console.error(e);alert('Message could not be sent.\n\nFirebase: '+(e.code||'unknown')+'\n'+(e.message||''));updateSendButton()})}function compressImage(f){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=reject;r.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{let w=img.width,h=img.height,max=1280;if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',.72))};img.src=r.result};r.readAsDataURL(f)})}function chooseFile(){const f=E('fileInput').files[0];if(!f)return;if(!f.type.startsWith('image/'))return alert('Please select an image.');if(f.size>15*1024*1024)return alert('Please choose an image smaller than 15 MB.');file=f;E('previewImg').src=URL.createObjectURL(f);E('previewName').textContent=f.name;E('preview').classList.add('show');updateSendButton()}function clearFile(){file=null;E('fileInput').value='';E('preview').classList.remove('show');E('previewImg').removeAttribute('src');E('previewName').textContent='';updateSendButton()}</script></body></html>
