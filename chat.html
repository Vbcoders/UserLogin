<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Private Chat</title><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script><style>:root{--b:#2563eb;--b2:#4f8df7;--ink:#172033;--muted:#7b8495;--line:#e6ebf2;--bg:#f5f9ff;--green:#22c55e}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);user-select:none}body{overflow:hidden;visibility:hidden}body.ready{visibility:visible}button,input,textarea{font:inherit}button{cursor:pointer}.app{height:100dvh;display:flex;justify-content:center;align-items:center;padding:14px;background:radial-gradient(circle at 0 0,#dbeafe,transparent 32%),radial-gradient(circle at 100% 100%,#dcfce7,transparent 28%),#f4f8ff}.chat{width:min(1000px,100%);height:min(920px,100%);background:#fff;border-radius:25px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 70px #163a5d20}.header{height:76px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:#fff}.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#edf2fa}.person{flex:1;min-width:0}.name{font-weight:750;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:12px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px}.dot{width:7px;height:7px;border-radius:50%;background:#aeb7c5}.dot.online{background:var(--green);box-shadow:0 0 0 3px #22c55e19}.menu-wrap{position:relative}.more{width:40px;height:40px;border:0;background:transparent;border-radius:12px;font-size:23px;color:#586579}.menu{position:absolute;right:0;top:47px;width:210px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:7px;box-shadow:0 18px 45px #15243b25;z-index:30}.menu.hidden{display:none}.menu button{width:100%;border:0;background:#fff;text-align:left;padding:11px;border-radius:10px;color:#26364d}.menu button:hover{background:#f4f7fb}.logout{color:#dc2626!important}.messages{flex:1;min-height:0;overflow:auto;padding:20px 17px 12px;background:#f8fbff;background-image:radial-gradient(#dce8f5 1px,transparent 1px);background-size:24px 24px}.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}.row{display:flex;margin:5px 0 9px}.row.mine{justify-content:flex-end}.bubble{max-width:min(75%,590px);padding:10px 13px 8px;background:#fff;border:1px solid #e5ebf2;border-radius:19px 19px 19px 6px;box-shadow:0 3px 12px #183b640b;cursor:pointer}.mine .bubble{background:linear-gradient(135deg,var(--b),var(--b2));border:0;color:#fff;border-radius:19px 19px 6px 19px}.sender{font-size:11px;font-weight:750;color:var(--b);margin-bottom:4px}.text{font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.meta{text-align:right;font-size:10px;opacity:.65;margin-top:5px}.img{display:block;max-width:min(340px,72vw);max-height:430px;border-radius:13px;object-fit:cover;cursor:pointer}.caption{margin-top:6px;white-space:pre-wrap}.reaction-list{display:flex;gap:4px;margin-top:5px}.reaction{font-size:12px;background:#fff;color:#27364f;border:1px solid #dce5f0;border-radius:11px;padding:3px 7px}.typing{height:25px;padding:4px 19px;color:var(--b);font-size:12px}.typing.hidden{visibility:hidden}.composer{position:relative;padding:9px 12px calc(9px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}.composer-row{display:flex;align-items:flex-end;gap:7px;padding:5px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:25px}.attach,.send{width:39px;height:39px;flex:none;border:0;border-radius:50%;display:grid;place-items:center}.attach{background:#e5ecf5;color:#53627a;font-size:22px}.send{background:#b8c5d7;color:#fff;font-size:17px}.send.ready{background:linear-gradient(135deg,var(--b),var(--b2));box-shadow:0 5px 14px #2563eb2e}.input{width:100%;min-height:39px;max-height:120px;resize:none;border:0;outline:0;background:transparent;padding:9px 3px;line-height:21px;font-size:15px;color:var(--ink)}.input-wrap{flex:1;min-width:0}.file{display:none}.preview{display:none;position:absolute;left:12px;right:12px;bottom:72px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:8px;align-items:center;gap:9px;box-shadow:0 15px 40px #0f274322}.preview.show{display:flex}.preview img{width:58px;height:58px;border-radius:10px;object-fit:cover}.preview span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:#687286}.close{border:0;border-radius:50%;width:29px;height:29px;background:#edf2f7;color:#687286}.viewer{position:fixed;inset:0;background:#07101de8;display:none;align-items:center;justify-content:center;z-index:100}.viewer.show{display:flex}.viewer img{max-width:96vw;max-height:90vh}.viewer button{position:absolute;right:16px;top:16px}.sheet{position:fixed;inset:0;background:#07122555;display:none;align-items:flex-end;justify-content:center;padding:10px;z-index:200}.sheet.show{display:flex}.sheetbox{width:min(430px,100%);background:#fff;border-radius:22px;padding:10px;box-shadow:0 20px 70px #0004}.sheettitle{font-size:12px;color:#7b8495;padding:7px}.reactrow{display:flex;justify-content:space-around;padding:5px 0 10px;border-bottom:1px solid #edf0f4}.reactrow button{border:0;background:#f4f7fb;border-radius:12px;width:44px;height:40px;font-size:21px}.sheetbtn{width:100%;border:0;background:#fff;text-align:left;padding:12px;border-radius:10px}.danger{color:#dc2626}.cancel{text-align:center;color:var(--b);font-weight:700}@media(max-width:650px){.app{padding:0}.chat{height:100dvh;border-radius:0}.bubble{max-width:85%}.messages{padding:16px 11px}.img{max-width:78vw}}</style></head><body><div class="app"><div id="root" class="chat"></div></div><div id="viewer" class="viewer"><button id="closeViewer" class="close">×</button><img id="viewerImg"></div><div id="sheet" class="sheet"><div class="sheetbox"><div id="sheetTitle" class="sheettitle"></div><div class="reactrow"><button data-r="❤️">❤️</button><button data-r="😂">😂</button><button data-r="👍">👍</button><button data-r="😮">😮</button><button data-r="😢">😢</button><button data-r="🔥">🔥</button></div><button id="reply" class="sheetbtn">↩ Reply</button><button id="copy" class="sheetbtn">⧉ Copy</button><button id="del" class="sheetbtn danger">🗑 Delete</button><button id="cancel" class="sheetbtn cancel">Cancel</button></div></div><script>
const firebaseConfig={apiKey:"AIzaSyBEw7edw-jRq47N_d1fJUvBSVnROJ6eCcE",authDomain:"messanger-817c9.firebaseapp.com",databaseURL:"https://messanger-817c9-default-rtdb.firebaseio.com",projectId:"messanger-817c9",storageBucket:"messanger-817c9.appspot.com",messagingSenderId:"678307855723",appId:"1:678307855723:web:ac21ee338a71dd34f9602e",measurementId:"G-37SG00MKXC"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.database();let me=null,partnerUid=null,partnerName="User",partnerKey=null,myKeys=null,chatListener=null,typingListener=null,onlineListener=null,actionTarget=null,replyTarget=null,file=null,typingTimer=null,notificationReady=false;const $=id=>document.getElementById(id);const avatars=['https://api.dicebear.com/9.x/bottts/svg?seed=one','https://api.dicebear.com/9.x/fun-emoji/svg?seed=two','https://api.dicebear.com/9.x/adventurer/svg?seed=three','https://api.dicebear.com/9.x/big-smile/svg?seed=four'];
function nameOf(u){let n=u?.displayName||u?.email||'User';n=n.split('@')[0].replace(/[._-]+/g,' ').trim();return n.split(/\s+/).filter(Boolean).map(x=>x[0].toUpperCase()+x.slice(1).toLowerCase()).join(' ')||'User'}function avatar(uid){let h=0;for(const c of uid||'')h=(h*31+c.charCodeAt(0))>>>0;return avatars[h%avatars.length]}function b64(bytes){let s='';bytes.forEach(x=>s+=String.fromCharCode(x));return btoa(s)}function ub64(s){const x=atob(s);return Uint8Array.from(x,c=>c.charCodeAt(0))}function ab2b64(buf){return b64(new Uint8Array(buf))}async function jwkPublic(k){return crypto.subtle.exportKey('jwk',k)}
async function ensureKeys(){const d=await new Promise((res,rej)=>{const r=indexedDB.open('private-chat-keys',1);r.onupgradeneeded=()=>r.result.createObjectStore('keys');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});myKeys=await new Promise((res,rej)=>{const t=d.transaction('keys','readonly').objectStore('keys').get('ecdh');t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)});if(!myKeys){myKeys=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},false,['deriveKey']);await new Promise((res,rej)=>{const t=d.transaction('keys','readwrite').objectStore('keys').put(myKeys,'ecdh');t.onsuccess=res;t.onerror=()=>rej(t.error)})}const pub=await jwkPublic(myKeys.publicKey);await db.ref('e2eeKeys/'+me.uid).update({publicKey:pub,updatedAt:firebase.database.ServerValue.TIMESTAMP})}
async function derive(otherJwk){const pub=await crypto.subtle.importKey('jwk',otherJwk,{name:'ECDH',namedCurve:'P-256'},false,[]);return crypto.subtle.deriveKey({name:'ECDH',public:pub},myKeys.privateKey,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}async function encryptPayload(payload,key){const iv=crypto.getRandomValues(new Uint8Array(12));const plain=new TextEncoder().encode(JSON.stringify(payload));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain);return {iv:ab2b64(iv),ciphertext:ab2b64(ct)}}async function decryptPayload(m){if(!m.encrypted||!m.ciphertext||!m.iv||!m.senderPublicKey)return null;try{const jwk=m.uid===me.uid?(m.recipientPublicKey||m.senderPublicKey):m.senderPublicKey;const key=await derive(JSON.parse(jwk));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(m.iv)},key,ub64(m.ciphertext));return JSON.parse(new TextDecoder().decode(pt))}catch(e){return null}}
async function publishDirectory(){await db.ref('users/'+me.uid).update({email:(me.email||'').toLowerCase(),displayName:nameOf(me),photoURL:me.photoURL||avatar(me.uid),updatedAt:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{})}async function chooseRecipient(){const email=prompt('Enter the other user email:','');if(!email)return;const snap=await db.ref('users').orderByChild('email').equalTo(email.trim().toLowerCase()).once('value');let found=null;snap.forEach(s=>found={uid:s.key,...s.val()});if(!found){alert('User not found. Ask them to open the app once so their secure key can be registered.');return}if(found.uid===me.uid){alert('Choose another user.');return}partnerUid=found.uid;partnerName=nameOf(found);partnerKey=null;await loadPartnerKey();renderHeader();loadMessages()}
async function loadPartnerKey(){if(!partnerUid)return false;const s=await db.ref('e2eeKeys/'+partnerUid+'/publicKey').once('value');partnerKey=s.val()||null;return !!partnerKey}function renderHeader(){$('avatar').src=partnerUid?avatar(partnerUid):avatar('none');$('pname').textContent=partnerUid?partnerName:'Choose a user';$('stat').innerHTML=partnerUid?'<span class="dot"></span>End-to-end encrypted 🔒':'<span class="dot"></span>Secure chat'}
function build(){$('root').innerHTML='<header class="header"><img id="avatar" class="avatar"><div class="person"><div id="pname" class="name">Choose a user</div><div id="stat" class="status"></div></div><div class="menu-wrap"><button id="more" class="more">⋯</button><div id="menu" class="menu hidden"><button id="choose">👤 Choose recipient</button><button id="profile">⚙ My account</button><button id="notify">🔔 Enable notifications</button><button id="logout" class="logout">↪ Logout</button></div></div></header><main id="messages" class="messages"></main><div id="typing" class="typing hidden">Typing…</div><footer class="composer"><div id="preview" class="preview"><img id="previewImg"><span id="previewName"></span><button id="clearFile" class="close">×</button></div><div class="composer-row"><input id="file" class="file" type="file" accept="image/*"><button id="attach" class="attach">＋</button><div class="input-wrap"><textarea id="input" class="input" rows="1" maxlength="4000" placeholder="Write a message…"></textarea></div><button id="send" class="send">➤</button></div></footer>';renderHeader();$('more').onclick=e=>{e.stopPropagation();$('menu').classList.toggle('hidden')};$('choose').onclick=chooseRecipient;$('profile').onclick=()=>location.href='profile.html';$('notify').onclick=requestNotifications;$('logout').onclick=logout;$('attach').onclick=()=>$('file').click();$('file').onchange=chooseFile;$('clearFile').onclick=clearFile;$('send').onclick=send;$('input').oninput=handleInput;$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('closeViewer').onclick=closeViewer;$('cancel').onclick=closeSheet;$('reply').onclick=()=>{if(actionTarget){replyTarget=actionTarget;closeSheet();$('input').focus()}};$('copy').onclick=()=>{if(actionTarget?.plain?.text)navigator.clipboard?.writeText(actionTarget.plain.text);closeSheet()};$('del').onclick=()=>{if(actionTarget?.uid===me.uid&&confirm('Delete this message?'))db.ref('chats/'+actionTarget.key).remove();closeSheet()};document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>react(b.dataset.r));$('sheet').onclick=e=>{if(e.target===$('sheet'))closeSheet()}}
function handleInput(){const i=$('input');i.style.height='auto';i.style.height=Math.min(i.scrollHeight,120)+'px';$('send').classList.toggle('ready',!!i.value.trim()||!!file);setTyping(!!i.value.trim())}function chooseFile(e){file=e.target.files?.[0]||null;if(file){$('previewImg').src=URL.createObjectURL(file);$('previewName').textContent=file.name;$('preview').classList.add('show')}handleInput()}function clearFile(){file=null;$('file').value='';$('preview').classList.remove('show');handleInput()}function compressImage(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{let w=i.width,h=i.height,m=1280;if(w>m||h>m){if(w>h){h=h*m/w;w=m}else{w=w*m/h;h=m}}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);res(c.toDataURL('image/jpeg',.82))};i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}
async function send(){if(!partnerUid){await chooseRecipient();if(!partnerUid)return}if(!partnerKey&&!(await loadPartnerKey())){alert('The other user has not opened the app yet, so their encryption key is not registered. Ask them to log in once.');return}const input=$('input'),text=input.value.trim();if(!text&&!file)return;const payload={type:file?'image':'text',text,caption:text,image:null,replyTo:replyTarget?{uid:replyTarget.uid,text:replyTarget.plain?.text||''}:null};if(file)payload.image=await compressImage(file);const key=await derive(partnerKey);const enc=await encryptPayload(payload,key);const senderPublic=await jwkPublic(myKeys.publicKey);await db.ref('chats').push({uid:me.uid,toUid:partnerUid,senderName:nameOf(me),senderPublicKey:JSON.stringify(senderPublic),recipientPublicKey:JSON.stringify(partnerKey),encrypted:true,...enc,timestampMs:firebase.database.ServerValue.TIMESTAMP});input.value='';replyTarget=null;clearFile();handleInput();setTyping(false)}
async function loadMessages(){const s=await db.ref('chats').once('value');await renderSnapshot(s)}async function renderSnapshot(s){const arr=[];s.forEach(c=>{const m=c.val();if(m?.uid)arr.push({...m,key:c.key})});arr.sort((a,b)=>(a.timestampMs||0)-(b.timestampMs||0));if(!partnerUid){const incoming=arr.filter(m=>m.uid!==me.uid&&m.toUid===me.uid).pop();if(incoming){partnerUid=incoming.uid;partnerName=nameOf({displayName:incoming.senderName});await loadPartnerKey();renderHeader()}}const target=partnerUid?arr.filter(m=>(m.uid===me.uid&&m.toUid===partnerUid)||(m.uid===partnerUid&&m.toUid===me.uid)):[];const decoded=[];for(const m of target){const plain=m.encrypted?await decryptPayload(m):{type:m.type||'text',text:m.message||m.text||'',image:m.imageData||null,caption:m.caption||'',replyTo:m.replyTo};if(plain)decoded.push({...m,plain});else if(m.encrypted)decoded.push({...m,plain:{type:'text',text:'🔒 Unable to decrypt on this device',locked:true}})}renderMessages(decoded)}
function listenMessages(){chatListener=s=>{renderSnapshot(s).catch(()=>{})};db.ref('chats').on('value',chatListener)}function renderMessages(arr){const box=$('messages');if(!box)return;if(!arr.length){box.innerHTML='<div class="empty"><div><strong>Private & encrypted 🔒</strong><span>Messages are encrypted on your devices before Firebase receives them.</span></div></div>';return}box.innerHTML='';for(const m of arr){const row=document.createElement('div');row.className='row '+(m.uid===me.uid?'mine':'theirs');const b=document.createElement('div');b.className='bubble';b.onclick=e=>{if(e.target.tagName!=='IMG')openSheet(m)};if(m.uid!==me.uid){const s=document.createElement('div');s.className='sender';s.textContent=nameOf({displayName:m.senderName});b.appendChild(s)}if(m.plain.locked){const t=document.createElement('div');t.className='text';t.textContent=m.plain.text;b.appendChild(t)}else if(m.plain.type==='image'&&m.plain.image){const im=document.createElement('img');im.className='img';im.src=m.plain.image;im.onclick=e=>{e.stopPropagation();$('viewerImg').src=m.plain.image;$('viewer').classList.add('show')};b.appendChild(im);if(m.plain.caption){const c=document.createElement('div');c.className='caption';c.textContent=m.plain.caption;b.appendChild(c)}}else{const t=document.createElement('div');t.className='text';t.textContent=m.plain.text||'';b.appendChild(t)}const meta=document.createElement('div');meta.className='meta';meta.textContent=m.timestampMs?new Date(m.timestampMs).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';b.appendChild(meta);if(m.reactions){const rl=document.createElement('div');rl.className='reaction-list';Object.values(m.reactions).forEach(r=>{const x=document.createElement('span');x.className='reaction';x.textContent=r;rl.appendChild(x)});b.appendChild(rl)}row.appendChild(b);box.appendChild(row)}box.scrollTop=box.scrollHeight}
function openSheet(m){actionTarget=m;$('sheetTitle').textContent=m.plain?.text||'Message';$('del').style.display=m.uid===me.uid?'block':'none';$('sheet').classList.add('show')}function closeSheet(){actionTarget=null;$('sheet').classList.remove('show')}async function react(r){if(!actionTarget)return;await db.ref('chats/'+actionTarget.key+'/reactions/'+me.uid).set(r);closeSheet()}
function setTyping(v){if(!partnerUid||!me)return;clearTimeout(typingTimer);const r=db.ref('presence/typing/'+me.uid);r.set({toUid:partnerUid,active:v,ts:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{});if(v)typingTimer=setTimeout(()=>setTyping(false),2500)}function listenTyping(){typingListener=s=>{if(!partnerUid)return;const v=s.val()?.[partnerUid];const active=!!v&&v.toUid===me.uid&&v.active&&Date.now()-(v.ts||Date.now())<3500;$('typing').classList.toggle('hidden',!active)};db.ref('presence/typing').on('value',typingListener)}function setOnline(v){if(!me)return;const r=db.ref('presence/online/'+me.uid);v?r.set(true):r.remove();if(v)r.onDisconnect().remove()}function listenPresence(){onlineListener=s=>{if(partnerUid){const on=!!s.val()?.[partnerUid];$('stat').innerHTML='<span class="dot '+(on?'online':'')+'"></span>'+(on?'Active now':'Offline')+' 🔒 E2EE'}};db.ref('presence/online').on('value',onlineListener)}function detach(){if(chatListener)db.ref('chats').off('value',chatListener);if(typingListener)db.ref('presence/typing').off('value',typingListener);if(onlineListener)db.ref('presence/online').off('value',onlineListener)}async function requestNotifications(){if(!('Notification'in window))return;notificationReady=(await Notification.requestPermission().catch(()=>null))==='granted'}function logout(){detach();setTyping(false);setOnline(false);auth.signOut().then(()=>location.href='index.html')}function closeViewer(){$('viewer').classList.remove('show');$('viewerImg').removeAttribute('src')}
auth.onAuthStateChanged(async u=>{if(!u){location.href='index.html';return}me=u;build();await initAfterBuild()});async function initAfterBuild(){try{await ensureKeys();await publishDirectory();listenMessages();listenPresence();listenTyping();await loadMessages();await requestNotifications();document.body.classList.add('ready');setOnline(true)}catch(e){document.body.classList.add('ready');alert('Secure chat setup failed: '+e.message)}}window.addEventListener('beforeunload',()=>{setTyping(false);setOnline(false)});
</script></body></html>
