<style>

.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#e9effb}.person{flex:1;min-width:0}.name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{display:flex;align-items:center;gap:5px;font-size:12px;color:#7b8495;margin-top:4px}.online-dot,.offline-dot{width:8px;height:8px;border-radius:50%;display:inline-block}.online-dot{background:#22c55e}.offline-dot{background:#a7afbd}

.typing{height:22px;padding:0 21px;font-size:12px;color:#2563eb}.typing.hidden{visibility:hidden}.composer{position:relative;display:flex;align-items:flex-end;gap:8px;padding:10px 13px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #e8ecf2;background:#fff}.attach{width:42px;height:42px;border:0;border-radius:50%;background:#f0f3f8;color:#536079;font-size:24px;cursor:pointer}.input-wrap{flex:1;background:#f1f4f8;border-radius:22px}.input{display:block;width:100%;min-height:42px;max-height:130px;resize:none;border:0;outline:0;background:transparent;padding:11px 14px;font-size:15px}.send{width:42px;height:42px;border:0;border-radius:50%;background:#2563eb;color:#fff;font-size:18px;opacity:.35;cursor:pointer}.send.ready{opacity:1}

.action-backdrop{position:fixed;inset:0;background:#07122555;z-index:1100;display:none;align-items:flex-end;justify-content:center;padding:16px}.action-backdrop.show{display:flex}.action-sheet{width:min(430px,100%);background:#fff;border-radius:20px;padding:10px;box-shadow:0 20px 60px #0004;animation:sheetIn .16s ease-out}.action-title{font-size:12px;color:#7b8495;padding:8px 10px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.reaction-row{display:flex;justify-content:space-around;padding:6px 2px 9px;border-bottom:1px solid #edf0f4}.reaction-choice{border:0;background:#f4f7fb;border-radius:14px;width:48px;height:42px;font-size:23px;cursor:pointer}.action-btn{width:100%;border:0;background:#fff;text-align:left;padding:13px 12px;border-radius:11px;font-size:15px;cursor:pointer}.action-btn:active,.reaction-choice:active{background:#eef3f9}.action-btn.danger{color:#dc2626}.action-btn.disabled{color:#a8b0bd;pointer-events:none}.action-cancel{text-align:center;font-weight:700;color:#2563eb;margin-top:3px}@keyframes sheetIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

</style>

<body>

<div id="viewer" class="viewer"><button id="viewerClose" class="viewer-close">×</button><img id="viewerImg" alt="Image"></div>

<script>
const firebaseConfig={apiKey:"AIzaSyBEw7edw-jRq47N_d1fJUvBSVnROJ6eCcE",authDomain:"messanger-817c9.firebaseapp.com",databaseURL:"https://messanger-817c9-default-rtdb.firebaseio.com",projectId:"messanger-817c9",storageBucket:"messanger-817c9.appspot.com",messagingSenderId:"678307855723",appId:"1:678307855723:web:ac21ee338a71dd34f9602e",measurementId:"G-37SG00MKXC"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.database();let currentUser=null,file=null,typingTimer=null,partnerUid=null,replyTarget=null,actionTarget=null,chatHandler=null,typingHandler=null,presenceHandler=null,chatReady=false,incomingKeys=new Set(),notificationsEnabled=true,notificationReady=false;const E=id=>document.getElementById(id);const avatars=['https://api.dicebear.com/9.x/bottts/svg?seed=chat1','https://api.dicebear.com/9.x/fun-emoji/svg?seed=chat2','https://api.dicebear.com/9.x/adventurer/svg?seed=chat3','https://api.dicebear.com/9.x/big-smile/svg?seed=chat4'];
function displayName(u){let n=(u&&u.displayName)||(u&&u.email)||'User';n=n.split('@')[0].trim().replace(/[._-]+/g,' ');return n.split(/\s+/).filter(Boolean).map(x=>x[0].toUpperCase()+x.slice(1).toLowerCase()).join(' ')||'User'}function avatarFor(uid){let h=0;for(let i=0;i<(uid||'').length;i++)h=(h*31+uid.charCodeAt(i))>>>0;return avatars[h%avatars.length]}function showLogin(){window.location.replace('index.html')}
auth.onAuthStateChanged(u=>{if(!u){notificationsEnabled=false;detach();showLogin();return}currentUser=u;chat();document.body.classList.add('ready');setOnline(true);prepareNotifications()});
function chat(){E('root').innerHTML='<header class="header"><img id="avatar" class="avatar"><div class="person"><div id="pname" class="name">Private Chat</div><div id="stat" class="status"><span class="offline-dot"></span>Connecting…</div></div><div class="menu-wrap"><button id="menuBtn" class="icon">⋯</button><div id="menu" class="menu hidden"><button id="myProfile">My account</button><button id="notifyBtn">Enable notifications</button><button id="logoutBtn" class="logout">Logout</button></div></div></header><main id="messages" class="messages"></main><div id="typing" class="typing hidden"></div><footer class="composer"><div id="replyPreview" class="reply-preview"><div class="reply-preview-text"><div id="replyName" class="reply-preview-name"></div><div id="replyMessage" class="reply-preview-message"></div></div><button id="cancelReply" class="close">×</button></div><div id="preview" class="preview"><img id="previewImg"><span id="previewName"></span><button id="closePreview" class="close">×</button></div><input id="fileInput" class="file" type="file" accept="image/*"><button id="attachBtn" class="attach">＋</button><div class="input-wrap"><textarea id="messageInput" class="input" rows="1" maxlength="4000" placeholder="Message…"></textarea></div><button id="sendBtn" class="send" type="button">➤</button></footer>';E('avatar').src=avatarFor(currentUser.uid);E('menuBtn').onclick=e=>{e.stopPropagation();E('menu').classList.toggle('hidden');updateNotifyButton()};E('myProfile').onclick=()=>{alert('Signed in as: '+displayName(currentUser));closeMenu()};E('notifyBtn').onclick=enableNotifications;E('logoutBtn').onclick=logout;E('attachBtn').onclick=()=>E('fileInput').click();E('fileInput').onchange=chooseFile;E('closePreview').onclick=clearFile;E('cancelReply').onclick=cancelReply;E('sendBtn').onclick=sendMessage;E('messageInput').oninput=handleInput;E('messageInput').onblur=()=>setTyping(false);E('messageInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}};E('viewerClose').onclick=closeViewer;E('viewer').onclick=e=>{if(e.target===E('viewer'))closeViewer()};E('actionCancel').onclick=closeActions;E('actionBackdrop').onclick=e=>{if(e.target===E('actionBackdrop'))closeActions()};document.querySelectorAll('.reaction-choice').forEach(b=>b.onclick=()=>reactTo(b.dataset.reaction));E('actionReply').onclick=()=>{if(actionTarget)replyTo(actionTarget);closeActions()};E('actionCopy').onclick=copyAction;E('actionDelete').onclick=()=>{if(actionTarget)deleteMessage(actionTarget._key);closeActions()};document.addEventListener('click',closeMenu);listenMessages();listenTyping();listenPresence();updateSendButton()}
function closeMenu(){const m=E('menu');if(m)m.classList.add('hidden')}function updateNotifyButton(){const b=E('notifyBtn');if(!b)return;if(!('Notification'in window)){b.textContent='Notifications unavailable';return}b.textContent=Notification.permission==='granted'?'Notifications enabled':'Enable notifications'}function prepareNotifications(){if(!('Notification'in window))return;notificationReady=Notification.permission==='granted';updateNotifyButton();if(Notification.permission==='default')setTimeout(()=>Notification.requestPermission().then(p=>{notificationReady=p==='granted';updateNotifyButton()}).catch(()=>{}),500)}function enableNotifications(){if(!('Notification'in window)){alert('This browser does not support notifications.');return}Notification.requestPermission().then(p=>{notificationReady=p==='granted';updateNotifyButton();if(notificationReady)playSound(true)}).catch(()=>{})}
function playSound(test){try{const C=AudioContext||webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(test?880:740,c.currentTime);o.frequency.exponentialRampToValueAtTime(test?1320:980,c.currentTime+.12);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.18,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.23);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.24);setTimeout(()=>c.close(),500)}catch(e){}}
function notify(m){if(!notificationsEnabled||!currentUser||m.uid===currentUser.uid||!notificationReady)return;playSound(false);try{const n=new Notification(displayName({displayName:m.senderName||'User'}),{body:m.type==='image'?'📷 Sent you an image':(m.message||'New message'),icon:m.profilePicUrl||avatarFor(m.uid),tag:'private-'+m._key,silent:true});n.onclick=()=>{window.focus();n.close()}}catch(e){}}
function setOnline(v){if(!currentUser)return;const r=db.ref('presence/online/'+currentUser.uid);if(v){r.set(true).catch(()=>{});r.onDisconnect().remove().catch(()=>{})}else r.remove().catch(()=>{})}function setTyping(v){if(!currentUser)return;const r=db.ref('presence/typing/'+currentUser.uid);clearTimeout(typingTimer);if(v){r.set({active:true,ts:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{});r.onDisconnect().set({active:false,ts:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{});typingTimer=setTimeout(()=>setTyping(false),2200)}else r.set({active:false,ts:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{})}
function detach(){if(chatHandler){db.ref('chats').off('value',chatHandler);chatHandler=null}if(typingHandler){db.ref('presence/typing').off('value',typingHandler);typingHandler=null}if(presenceHandler){db.ref('presence/online').off('value',presenceHandler);presenceHandler=null}}
function logout(){notificationsEnabled=false;notificationReady=false;detach();setTyping(false);setOnline(false);auth.signOut().then(()=>{localStorage.clear();showLogin()}).catch(e=>alert('Logout failed: '+e.message))}
function handleInput(){const i=E('messageInput');i.style.height='auto';i.style.height=Math.min(i.scrollHeight,130)+'px';updateSendButton();setTyping(!!i.value.trim())}function updateSendButton(){E('sendBtn').classList.toggle('ready',!!(E('messageInput').value.trim()||file))}
function listenTyping(){typingHandler=s=>{const x=s.val()||{},v=partnerUid?x[partnerUid]:null,active=!!v&&(v===true||v.active===true),fresh=!v||!v.ts||Date.now()-Number(v.ts)<3500;E('typing').classList.toggle('hidden',!(active&&fresh));E('stat').innerHTML=active&&fresh?'<span class="online-dot"></span>typing…':'<span class="offline-dot"></span>Offline'};db.ref('presence/typing').on('value',typingHandler)}function listenPresence(){presenceHandler=s=>{const x=s.val()||{};if(E('typing').classList.contains('hidden'))E('stat').innerHTML=partnerUid&&x[partnerUid]?'<span class="online-dot"></span>Active now':'<span class="offline-dot"></span>Offline'};db.ref('presence/online').on('value',presenceHandler)}
function listenMessages(){chatHandler=s=>{const list=[];s.forEach(c=>{const v=c.val();if(v&&v.uid)list.push({...v,_key:c.key})});list.sort((a,b)=>(a.timestampMs||0)-(b.timestampMs||0));if(!chatReady){list.forEach(m=>{if(m.uid!==currentUser.uid)incomingKeys.add(m._key)});chatReady=true}else list.forEach(m=>{if(m.uid!==currentUser.uid&&!incomingKeys.has(m._key)){incomingKeys.add(m._key);notify(m)}});const inc=list.filter(m=>m.uid!==currentUser.uid);if(inc.length){const p=inc[inc.length-1];partnerUid=p.uid;E('pname').textContent=displayName({displayName:p.senderName});E('avatar').src=p.profilePicUrl||avatarFor(p.uid)}E('messages').innerHTML='';if(!list.length){E('messages').innerHTML='<div class="empty"><div><strong>Private conversation</strong><span>Send a message to start.</span></div></div>';return}list.forEach(addMessage);requestAnimationFrame(()=>E('messages').scrollTop=E('messages').scrollHeight)};db.ref('chats').on('value',chatHandler)}
function addMessage(m){const row=document.createElement('div');row.className='row '+(m.uid===currentUser.uid?'mine':'theirs');const w=document.createElement('div');w.className='bubble-wrap';const b=document.createElement('div');b.className='bubble';if(m.uid!==currentUser.uid){const s=document.createElement('div');s.className='sender';s.textContent=displayName({displayName:m.senderName});b.appendChild(s)}if(m.replyTo){const q=document.createElement('div');q.style.cssText='border-left:3px solid #60a5fa;background:#f3f6fb;color:#687286;padding:6px 8px;border-radius:8px;margin-bottom:7px;font-size:11px';q.textContent='↩ '+(m.replyTo.message||'');b.appendChild(q)}if(m.type==='image'&&m.imageData){const im=document.createElement('img');im.className='msg-image';im.src=m.imageData;im.onclick=e=>{e.stopPropagation();openViewer(m.imageData)};b.appendChild(im);if(m.caption){const c=document.createElement('div');c.className='caption';c.textContent=m.caption;b.appendChild(c)}}else{const t=document.createElement('div');t.className='text';t.textContent=m.message||'';b.appendChild(t)}const meta=document.createElement('div');meta.className='meta';meta.textContent=m.time||new Date(m.timestampMs||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});if(m.uid===currentUser.uid)meta.textContent+=' ✓✓';b.appendChild(meta);if(m.reactions){const rr=document.createElement('div');rr.className='reaction-list';Object.values(m.reactions).filter(Boolean).forEach(x=>{const r=document.createElement('span');r.className='reaction';r.textContent=x;rr.appendChild(r)});b.appendChild(rr)}b.onclick=()=>openActions(m);w.appendChild(b);row.appendChild(w);E('messages').appendChild(row)}
function openActions(m){actionTarget=m;const hasCopy=!!(m.message||m.caption);E('actionTitle').textContent=m.type==='image'?'Image message':(m.message||'Message');E('actionCopy').classList.toggle('disabled',!hasCopy);E('actionDelete').style.display=m.uid===currentUser.uid?'block':'none';E('actionBackdrop').classList.add('show')}
function closeActions(){actionTarget=null;E('actionBackdrop').classList.remove('show')}
function replyTo(m){replyTarget={key:m._key,uid:m.uid,name:m.senderName,message:m.type==='image'?(m.caption||'📷 Image'):m.message||''};E('replyName').textContent='Replying to '+displayName({displayName:replyTarget.name});E('replyMessage').textContent=replyTarget.message||'📷 Image';E('replyPreview').classList.add('show');E('messageInput').focus()}
function cancelReply(){replyTarget=null;E('replyPreview').classList.remove('show')}
function copyAction(){if(!actionTarget)return;const text=actionTarget.message||actionTarget.caption||'';if(!text){closeActions();return}if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>closeActions()).catch(()=>fallbackCopy(text))}else fallbackCopy(text)}
function fallbackCopy(text){const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.left='-9999px';document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(e){}t.remove();closeActions()}
function reactTo(emoji){if(!actionTarget||!currentUser)return;const key=actionTarget._key;db.ref('chats/'+key+'/reactions/'+currentUser.uid).set(emoji).catch(e=>alert('Reaction failed: '+e.message));closeActions()}
function deleteMessage(k){if(!k)return;if(confirm('Delete this message?'))db.ref('chats/'+k).remove().catch(e=>alert('Delete failed: '+e.message))}
function openViewer(s){E('viewerImg').src=s;E('viewer').classList.add('show')}function closeViewer(){E('viewer').classList.remove('show');E('viewerImg').removeAttribute('src')}
function sendMessage(){const i=E('messageInput'),text=i.value.trim(),rt=replyTarget?{key:replyTarget.key,uid:replyTarget.uid,name:replyTarget.name,message:replyTarget.message}:null;if(!text&&!file)return;if(file){compressImage(file).then(data=>push({type:'image',imageData:data,caption:text,replyTo:rt}));return}push({type:'text',message:text,replyTo:rt})}
function push(data){db.ref('chats').push({...data,uid:currentUser.uid,senderName:displayName(currentUser),profilePicUrl:currentUser.photoURL||avatarFor(currentUser.uid),timestampMs:firebase.database.ServerValue.TIMESTAMP,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}).then(()=>{E('messageInput').value='';clearFile();cancelReply();handleInput()}).catch(e=>alert('Message could not be sent.\n\nFirebase: '+(e.code||e.message)))}
function compressImage(f){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{let w=i.width,h=i.height,m=1280;if(w>m||h>m){if(w>h){h=h*m/w;w=m}else{w=w*m/h;h=m}}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);resolve(c.toDataURL('image/jpeg',.82))};i.onerror=reject;i.src=r.result};r.onerror=reject;r.readAsDataURL(f)})}
function chooseFile(e){file=e.target.files&&e.target.files[0];if(file){E('previewImg').src=URL.createObjectURL(file);E('previewName').textContent=file.name;E('preview').classList.add('show');updateSendButton()}}function clearFile(){file=null;E('fileInput').value='';E('preview').classList.remove('show');E('previewImg').removeAttribute('src');updateSendButton()}
